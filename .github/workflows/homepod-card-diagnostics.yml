name: Synthetic HomePod audio and channel focus diagnostics

# Temporary, focused diagnostics. Synthetic inputs are made inside the runner.
# No user media, uploaded artifacts, paid runners, caches, releases, or retries.
"on":
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: homepod-card-diagnostics-${{ github.sha }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
  TVOS_TEST_DESTINATION: platform=tvOS Simulator,name=Apple TV 4K (3rd generation),OS=27.0
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_ANALYTICS: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  focused-diagnostics:
    name: Real AAC fragments and rendered card focus
    if: ${{ github.head_ref == 'test/homepod-audio-card-diagnostics' }}
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - name: Check out exact PR merge revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare tvOS tools and dependencies
        id: prepare
        timeout-minutes: 40
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "DIAGNOSTIC_MERGE_HEAD=$GITHUB_SHA"
          echo "DIAGNOSTIC_PR_HEAD=${{ github.event.pull_request.head.sha }}"
          test "$(xcodebuild -version | head -n 1)" = "Xcode 27.0"
          test "$(xcrun --sdk appletvsimulator --show-sdk-version)" = "27.0"
          brew install mint jq ripgrep ffmpeg
          ./ci_scripts/ci_post_clone.sh
          xcodebuild -downloadComponent MetalToolchain
          ./Scripts/bootstrap.sh --check
          ./Scripts/verify-licenses.sh
      - name: Generate and verify synthetic 64-second HLG and AC3 input
        id: fixture
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          python3 Scripts/generate-homepod-audio-diagnostic-fixture.py
          test -s Tests/Fixtures/Video/synthetic-hlg50-ac3-64s.ts
          shasum -a 256 Tests/Fixtures/Video/synthetic-hlg50-ac3-64s.ts
      - name: Verify unmodified AAC fragments and Apple-decoded continuity
        if: ${{ !cancelled() && steps.fixture.outcome == 'success' }}
        timeout-minutes: 30
        run: |
          ./Scripts/test.sh -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/HomePodCardDiagnostics" \
            -resultBundlePath "$RUNNER_TEMP/AudioDiagnostics.xcresult" \
            -parallel-testing-enabled NO -collect-test-diagnostics never \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 300 \
            -maximum-test-execution-time-allowance 300 \
            -only-testing:VPlayerTests/HLSAVPlayerBackendTests/testSyntheticHLG50AC3OriginalAACFragmentsDecodeContinuously \
            -only-testing:VPlayerTests/HLSAVPlayerBackendTests/testSyntheticAACSilenceMeterDetectsOffsetTwentyOneMillisecondMute \
            -only-testing:VPlayerTests/SegmentedFMP4WriterTests/testTrackBundlesUseIndependentOneInputHLSWritersAndRetainDelegate \
            -only-testing:VPlayerTests/SegmentedFMP4WriterTests/testAACNativeMovieFragmentSequenceContinuesAcrossWriterWindows \
            -only-testing:VPlayerTests/SegmentedFMP4WriterTests/testWriterWindowFragmentSequenceAdvancesByMediaCountNotWriterIdentity \
            -only-testing:VPlayerTests/SegmentedFMP4WriterTests/testNativeMovieFragmentSequenceUInt32BoundaryAndInvalidConfigurations \
            2>&1 | tee "$RUNNER_TEMP/audio-diagnostic-tests.log"
      - name: Report audio diagnostics
        if: ${{ always() }}
        run: |
          python3 Scripts/report-xcresult-failures.py "$RUNNER_TEMP/AudioDiagnostics.xcresult" | tee "$RUNNER_TEMP/audio-diagnostic-summary.txt"
          python3 Scripts/verify-diagnostic-test-log.py audio "$RUNNER_TEMP/audio-diagnostic-tests.log"
      - name: Check rendered card scale during repeated flat and grouped scrolling
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        timeout-minutes: 30
        run: |
          ./Scripts/test.sh -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/HomePodCardDiagnostics" \
            -resultBundlePath "$RUNNER_TEMP/FocusDiagnostics.xcresult" \
            -parallel-testing-enabled NO -collect-test-diagnostics never \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 600 \
            -maximum-test-execution-time-allowance 600 \
            -only-testing:VPlayerUITests/ChannelCardFocusRasterTests \
            -only-testing:VPlayerUITests/ChannelCardFocusDiagnosticTests \
            2>&1 | tee "$RUNNER_TEMP/focus-diagnostic-tests.log"
      - name: Report focus diagnostics
        if: ${{ always() }}
        run: |
          python3 Scripts/report-xcresult-failures.py "$RUNNER_TEMP/FocusDiagnostics.xcresult" | tee "$RUNNER_TEMP/focus-diagnostic-summary.txt"
          python3 Scripts/verify-diagnostic-test-log.py focus "$RUNNER_TEMP/focus-diagnostic-tests.log"
