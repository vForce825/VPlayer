name: iOS 27 build and playback

"on":
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_ANALYTICS: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  generated-inputs:
    name: Pinned iOS generated-input readback
    runs-on: xcode-27
    timeout-minutes: 15
    outputs:
      needs_refresh: ${{ steps.generated.outputs.needs_refresh }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source and generator SDK
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = '27.0'
          test "$(xcrun --sdk iphonesimulator --show-sdk-version)" = '27.0'
      - name: Generate pinned inputs and compare committed bytes
        id: generated
        run: |
          brew install mint
          mint bootstrap
          python3 Scripts/emit-generated-ios-inputs.py capture --baseline "$RUNNER_TEMP/generated-before.json"
          xcodebuild -downloadComponent MetalToolchain
          Scripts/build-metal-libraries.sh --platform ios
          mint run yonaskolb/XcodeGen@2.44.1 xcodegen generate --spec project.yml --project . --project-root .
          python3 Scripts/emit-generated-ios-inputs.py emit --baseline "$RUNNER_TEMP/generated-before.json"
      - name: Fail closed until generated outputs are committed
        if: steps.generated.outputs.needs_refresh == 'true'
        run: |
          echo 'Commit the verified generated outputs before native acceptance.'
          exit 1
  ios-tests:
    name: iPhone simulator tests and unsigned device build
    needs: generated-inputs
    if: ${{ needs.generated-inputs.outputs.needs_refresh == 'false' }}
    runs-on: xcode-27
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source and SDK
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          echo "ACCEPTANCE_HEAD=$CANDIDATE_SHA"
          echo "ACCEPTANCE_TREE=$(git rev-parse HEAD^{tree})"
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = '27.0'
          test "$(xcrun --sdk iphonesimulator --show-sdk-version)" = '27.0'
      - name: Prepare audited iOS dependency profile
        id: prepare
        timeout-minutes: 40
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          echo "ACCEPTANCE_HEAD=$CANDIDATE_SHA"
          echo "ACCEPTANCE_TREE=$(git rev-parse HEAD^{tree})"
          brew install jq ripgrep
          command -v rg
          xcodebuild -downloadComponent MetalToolchain
          Scripts/build-ffmpeg.sh --platform ios
          Scripts/audit-ffmpeg.sh --platform ios Vendor/FFmpeg/Artifacts-iOS/FFmpeg.xcframework
          Scripts/Tests/test_ffmpeg_artifact_audit.sh --platform ios
          Scripts/Tests/test_ffmpeg_reproducibility.sh --platform ios
          python3 Scripts/Tests/test_ios_artifact_profiles.py
          python3 Scripts/Tests/test_ios_platform_boundaries.py
          python3 Scripts/Tests/test_ios_target_structure.py
          python3 Scripts/Tests/test_cpu_video_processing.py
          python3 Scripts/Tests/test_cpu_worker_service_contract.py
          python3 Scripts/Tests/test_ios_pip_contract.py
          python3 Scripts/Tests/test_samplebuffer_source_metadata.py
          python3 Scripts/Tests/test_ios_workflow.py
          python3 Scripts/Tests/test_release_workflow_gates.py
          python3 Scripts/Tests/test_release_build_capture.py
          python3 Scripts/Tests/test_release_instrumentation_config.py
          python3 Scripts/Tests/test_release_launch_configuration.py
          python3 Scripts/Tests/test_generated_input_transfer.py
          python3 Scripts/Tests/test_release_artifacts.py
          python3 Scripts/Tests/test_ci_post_clone.py
          python3 Scripts/Tests/test_ios_clang_evidence.py
          python3 Scripts/Tests/test_ios_startup_runner.py
          python3 Scripts/Tests/test_paused_workspace_malloc.py
          python3 Scripts/Tests/test_ios_benchmark_contract.py
          python3 Scripts/Tests/test_ios_test_status_report.py
          python3 Scripts/Tests/test_ios_pip_runtime_report.py
      - name: Choose an available iOS 27 iPhone simulator
        id: simulator
        run: |
          device="$(xcrun simctl list devices available -j | jq -r '
            .devices | to_entries[] | select(.key | contains("iOS-27-0")) |
            .value[] | select(.name | startswith("iPhone")) | .udid' | head -1)"
          test -n "$device"
          echo "IOS_TEST_DESTINATION=platform=iOS Simulator,id=$device" >> "$GITHUB_ENV"
          echo "IOS_SIMULATOR_UDID=$device" >> "$GITHUB_ENV"
      - name: Compile Release for a physical iPhone destination without signing
        timeout-minutes: 25
        run: |
          set -o pipefail
          test ! -e "$RUNNER_TEMP/iOS-Device"
          xcodebuild build -project VPlayer.xcodeproj -scheme VPlayeriOSRelease \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/iOS-Device" CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee /dev/stderr | \
            python3 Scripts/verify-release-artifacts.py capture --log "$RUNNER_TEMP/iOS-Device.log"
          python3 Scripts/verify-release-artifacts.py verify --sdk iphoneos \
            --derived-data "$RUNNER_TEMP/iOS-Device" --build-log "$RUNNER_TEMP/iOS-Device.log" \
            --scope app --ffmpeg Vendor/FFmpeg/Artifacts-iOS/FFmpeg.xcframework/ios-arm64/libFFmpeg.a
          python3 - <<'PYICON'
          import os, pathlib, plistlib
          app=pathlib.Path(os.environ['RUNNER_TEMP'])/'iOS-Device/Build/Products/Release-iphoneos/VPlayer.app'
          info=plistlib.loads((app/'Info.plist').read_bytes())
          assert info['CFBundleIdentifier']=='com.vforce.vplayer', 'Unexpected iPhone app identity'
          primary=info['CFBundleIcons']['CFBundlePrimaryIcon']
          assert primary['CFBundleIconName']=='AppIcon', 'iPhone AppIcon was not selected'
          assert primary['CFBundleIconFiles'], 'Compiled iPhone icon list is empty'
          for name in primary['CFBundleIconFiles']:
              assert any(p.stat().st_size for p in app.glob(name+'*.png')), 'Compiled icon image missing: '+name
          assert (app/'Assets.car').stat().st_size>0, 'Compiled asset catalog is missing'
          print('IOS_APP_IDENTITY_AND_ICON=passed')
          PYICON
      - name: Verify clean iOS Release Archive
        if: always() && !cancelled() && steps.prepare.outcome == 'success'
        timeout-minutes: 25
        run: |
          set -o pipefail
          test ! -e "$RUNNER_TEMP/iOS-Archive"
          test ! -e "$RUNNER_TEMP/iOS-Archive.xcarchive"
          xcodebuild archive -project VPlayer.xcodeproj -scheme VPlayeriOSRelease \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/iOS-Archive" \
            -archivePath "$RUNNER_TEMP/iOS-Archive.xcarchive" CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee /dev/stderr | \
            python3 Scripts/verify-release-artifacts.py capture --log "$RUNNER_TEMP/iOS-Archive.log"
          python3 Scripts/verify-release-artifacts.py verify --sdk iphoneos \
            --derived-data "$RUNNER_TEMP/iOS-Archive" --build-log "$RUNNER_TEMP/iOS-Archive.log" \
            --scope app --archive "$RUNNER_TEMP/iOS-Archive.xcarchive" \
            --ffmpeg Vendor/FFmpeg/Artifacts-iOS/FFmpeg.xcframework/ios-arm64/libFFmpeg.a
      - name: Report physical destination Release C compiler evidence
        if: always()
        timeout-minutes: 2
        run: |
          # Advisory evidence only; native build/test failures remain authoritative.
          compiler="$(xcrun --find clang 2>/dev/null)" || compiler=''
          compiler_version="$(xcrun clang --version 2>/dev/null)" || compiler_version=''
          compiler_version="${compiler_version%%$'\n'*}"
          python3 Scripts/report-ios-clang-evidence.py report \
            --log "$RUNNER_TEMP/iOS-Device.log" --derived-data "$RUNNER_TEMP/iOS-Device" \
            --cwd "$GITHUB_WORKSPACE" --sdk iphoneos --compiler "$compiler" \
            --compiler-version "$compiler_version" | tee -a "$GITHUB_STEP_SUMMARY" \
            || echo 'IOS_CPU_CLANG_EVIDENCE_UNVERIFIED=reporter_failed'
      - name: Build and verify clean iOS Release simulator Run
        id: release_run
        if: always() && !cancelled() && steps.prepare.outcome == 'success' && steps.simulator.outcome == 'success'
        timeout-minutes: 15
        run: |
          set -o pipefail
          test ! -e "$RUNNER_TEMP/iOS-Release"
          python3 Scripts/Support/ios-startup-runner.py --build-shipping \
            --simulator "$IOS_SIMULATOR_UDID" --derived-data "$RUNNER_TEMP/iOS-Release" \
            --build-log "$RUNNER_TEMP/iOS-Release.log"
          python3 Scripts/verify-release-artifacts.py verify --sdk iphonesimulator \
            --derived-data "$RUNNER_TEMP/iOS-Release" --build-log "$RUNNER_TEMP/iOS-Release.log" \
            --scope app --ffmpeg Vendor/FFmpeg/Artifacts-iOS/FFmpeg.xcframework/ios-arm64-simulator/libFFmpeg.a
      - name: Preflight PiP retirement and playlist deletion regressions
        id: regression_preflight
        if: always() && !cancelled() && steps.prepare.outcome == 'success' && steps.simulator.outcome == 'success'
        timeout-minutes: 20
        run: |
          set -o pipefail
          Scripts/test-ios.sh -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/iOS-Simulator" \
            -resultBundlePath "$RUNNER_TEMP/iOS-Regressions.xcresult" \
            -parallel-testing-enabled NO -collect-test-diagnostics never \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            -only-testing:VPlayeriOSTests/IOSPictureInPictureCoordinatorTests/testRetirementBeforeQueuedNativeStopCannotLeaveForegroundOnCPU \
            -only-testing:VPlayeriOSUITests/IOSLibraryFlowTests/testPlaylistDeleteCancelsWithoutRemovalAndRequiresExplicitConfirmation \
            2>&1 | tee "$RUNNER_TEMP/iOS-Regressions.log"
      - name: Report PiP retirement and playlist deletion preflight
        id: regression_preflight_report
        if: always()
        run: |
          status=0
          python3 Scripts/report-xcresult-failures.py "$RUNNER_TEMP/iOS-Regressions.xcresult" || status=1
          python3 Scripts/report-ios-test-status.py "$RUNNER_TEMP/iOS-Regressions.xcresult" --preflight || status=1
          if [ -f "$RUNNER_TEMP/iOS-Regressions.log" ]; then
            awk '/^IOS_PIP_RETIREMENT_STAGE=(retire|replace)\.(begin|before-initial-install|after-initial-install|before-start-hop|after-start-hop|before-stop-hop|before-retirement|after-retirement|after-stop-hop|before-close|after-close|before-replacement-start-hop|after-replacement-start-hop|before-stale-stop-hop|after-stale-stop-hop)$/ && count++ < 30 {print substr($0, 1, 240)}' "$RUNNER_TEMP/iOS-Regressions.log" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - name: Prepare mandatory synthetic shared-playback fixtures
        id: fixtures
        if: always() && !cancelled() && steps.prepare.outcome == 'success' && steps.simulator.outcome == 'success' && steps.regression_preflight.outcome == 'success' && steps.regression_preflight_report.outcome == 'success'
        timeout-minutes: 40
        run: |
          brew install pkgconf x264 x265 nasm
          tool_env="$(./Scripts/provision-hls-fixture-toolchain.sh)"
          source "$tool_env"
          ./Scripts/prepare-hls-ci-fixtures.sh --verify-committed
          test -s Tests/Fixtures/Video/synthetic-hlg50-ac3-64s.ts
      - name: Run shared playback and iPhone touch tests
        if: always() && !cancelled() && steps.prepare.outcome == 'success' && steps.simulator.outcome == 'success' && steps.regression_preflight.outcome == 'success' && steps.regression_preflight_report.outcome == 'success' && steps.fixtures.outcome == 'success'
        timeout-minutes: 60
        run: |
          set -o pipefail
          swift Scripts/report-host-audio-control.swift || echo 'HOST_AUDIO_CONTROL outcome=unverified reason=diagnostic_process_failed qualification=host-control-not-ios-acceptance'
          Scripts/test-ios.sh -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/iOS-Simulator" \
            -resultBundlePath "$RUNNER_TEMP/iOS.xcresult" \
            -parallel-testing-enabled NO -collect-test-diagnostics never \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 2>&1 | \
            python3 Scripts/report-ios-pip-runtime.py --candidate "$CANDIDATE_SHA"
      - name: Report functional test results
        if: always()
        run: |
          status=0
          python3 Scripts/report-xcresult-failures.py "$RUNNER_TEMP/iOS.xcresult" || status=1
          python3 Scripts/report-ios-test-status.py "$RUNNER_TEMP/iOS.xcresult" || status=1
          exit "$status"
      - name: Measure optimized CPU processing without device qualification
        if: always() && !cancelled() && steps.prepare.outcome == 'success' && steps.simulator.outcome == 'success'
        timeout-minutes: 30
        run: |
          set -o pipefail
          test ! -e "$RUNNER_TEMP/iOS-CPU-Release"
          # Query the production target directly; scheme output can omit dependencies.
          # These are resolved simulator settings, not a captured compiler invocation.
          echo 'IOS_CPU_BUILD_SETTINGS_SCOPE=VPlayerPlaybackiOS-Release-iphonesimulator-arm64'
          if xcodebuild -showBuildSettings -json -project VPlayer.xcodeproj -target VPlayerPlaybackiOS \
            -configuration Release -sdk iphonesimulator ARCHS=arm64 ENABLE_TESTABILITY=YES \
            CODE_SIGNING_ALLOWED=NO \
            > "$RUNNER_TEMP/iOS-CPU-Release-settings.json"; then
            python3 - "$RUNNER_TEMP/iOS-CPU-Release-settings.json" <<'PYSETTINGS' || echo 'IOS_CPU_BUILD_SETTINGS_UNVERIFIED=parser_failed'
          import json, sys
          try:
              with open(sys.argv[1]) as source:
                  rows = json.load(source)
              matches = [row for row in rows if isinstance(row, dict) and row.get('target') == 'VPlayerPlaybackiOS']
              if len(matches) != 1:
                  print('IOS_CPU_BUILD_SETTINGS_UNVERIFIED=expected_one_playback_target')
              else:
                  # OTHER_CFLAGS can contain private paths/macros; actual selected C flags are reported separately.
                  allowed = {'GCC_OPTIMIZATION_LEVEL': ('0', '1', '2', '3', 's', 'z', 'fast'),
                      'SWIFT_OPTIMIZATION_LEVEL': ('-Onone', '-O', '-Osize'), 'ENABLE_TESTABILITY': ('YES', 'NO')}
                  values = {key: value if value in allowed[key] else None
                      for key in allowed for value in [matches[0]['buildSettings'].get(key)]}
                  print('IOS_CPU_BUILD_SETTINGS=' + json.dumps(values, sort_keys=True))
          except (OSError, ValueError, TypeError, KeyError, AttributeError):
              print('IOS_CPU_BUILD_SETTINGS_UNVERIFIED=unreadable_target_settings')
          PYSETTINGS
          else
            echo 'IOS_CPU_BUILD_SETTINGS_UNVERIFIED=query_failed'
          fi
          xcodebuild test -project VPlayer.xcodeproj -scheme VPlayeriOSBenchmarks \
            -configuration Release ENABLE_TESTABILITY=YES \
            -destination "$IOS_TEST_DESTINATION" CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath "$RUNNER_TEMP/iOS-CPU-Release" \
            -resultBundlePath "$RUNNER_TEMP/iOS-CPU-Release.xcresult" \
            -parallel-testing-enabled NO -collect-test-diagnostics never \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            -only-testing:VPlayeriOSBenchmarks/YADIFGoldenPixelTests/testCPUYADIFBenchmarkReportsNativeHostMeasurementsWithoutDeviceQualification \
            -only-testing:VPlayeriOSBenchmarks/YADIFGoldenPixelTests/testCPUAdapterMatchesEveryPinnedNV12AndP010FieldExactly \
            -only-testing:VPlayeriOSBenchmarks/YADIFGoldenPixelTests/testPlaybackDiagnosticPolicyExcludesSignpostsFromShippingRelease \
            2>&1 | tee /dev/stderr | \
            python3 Scripts/verify-release-artifacts.py capture --log "$RUNNER_TEMP/iOS-CPU-Release.log"
          python3 Scripts/verify-release-artifacts.py verify --sdk iphonesimulator \
            --derived-data "$RUNNER_TEMP/iOS-CPU-Release" --build-log "$RUNNER_TEMP/iOS-CPU-Release.log" \
            --scope frameworks --ffmpeg Vendor/FFmpeg/Artifacts-iOS/FFmpeg.xcframework/ios-arm64-simulator/libFFmpeg.a
      - name: Report CPU measurement and qualification limits
        if: always()
        run: |
          # Advisory evidence only; native build/test failures remain authoritative.
          compiler="$(xcrun --find clang 2>/dev/null)" || compiler=''
          compiler_version="$(xcrun clang --version 2>/dev/null)" || compiler_version=''
          compiler_version="${compiler_version%%$'\n'*}"
          python3 Scripts/report-ios-clang-evidence.py report \
            --log "$RUNNER_TEMP/iOS-CPU-Release.log" --derived-data "$RUNNER_TEMP/iOS-CPU-Release" \
            --cwd "$GITHUB_WORKSPACE" --sdk iphonesimulator --compiler "$compiler" \
            --compiler-version "$compiler_version" | tee -a "$GITHUB_STEP_SUMMARY" \
            || echo 'IOS_CPU_CLANG_EVIDENCE_UNVERIFIED=reporter_failed'
          status=0
          python3 Scripts/report-xcresult-failures.py "$RUNNER_TEMP/iOS-CPU-Release.xcresult" || status=1
          python3 Scripts/report-ios-test-status.py "$RUNNER_TEMP/iOS-CPU-Release.xcresult" --benchmark || status=1
          python3 - "$RUNNER_TEMP/iOS-CPU-Release.log" <<'PYBENCH' >> "$GITHUB_STEP_SUMMARY"
          import hashlib, json, pathlib, re, sys
          number = r'[0-9]{1,12}(?:\.[0-9]{1,20})?(?:e[+-]?[0-9]{1,3})?'
          def samples(count):
              return r'\[' + number + (', ' + number) * (count - 1) + r'\]'
          environment = r'environment=(?:simulator-not-iphone-hardware|device-short-run-not-thermal-qualification) configuration=release'
          original = re.compile(r'IOS_CPU_YADIF_BENCH width=(1920|3840) height=(1080|2160) depth=(8|10) workers=[1-4] setup_ms=' + number + ' output_ms=' + number + ' warmup_ms=' + number + ' pair_ms=' + samples(5) + ' ' + environment)
          rows = {}
          duplicate = False
          try:
              log = pathlib.Path(sys.argv[1])
              metadata = pathlib.Path(str(log) + '.capture.json')
              assert metadata.stat().st_size <= 1024
              state = json.loads(metadata.read_text())
              assert isinstance(state, dict) and state.get('complete') is True and state.get('truncated') is False
              with log.open('rb') as source:
                  data = source.read(64 * 1024 * 1024 + 1)
              assert len(data) <= 64 * 1024 * 1024
              assert state.get('bytes') == len(data) and state.get('sha256') == hashlib.sha256(data).hexdigest()
              for raw in data.splitlines():
                  if len(raw) > 2048:
                      continue
                  line = raw.decode('utf-8', errors='replace')
                  match = original.fullmatch(line)
                  if not match or match.groups()[:2] not in [('1920','1080'),('3840','2160')]:
                      continue
                  key = match.groups()
                  duplicate |= key in rows
                  rows.setdefault(key, line)
              for line in rows.values():
                  print(line)
              verified = len(rows) == 4 and not duplicate
              print('IOS_CPU_BENCHMARK_SUMMARY=' + ('verified' if verified else 'unverified') + f' cases={len(rows)}' + ('' if verified else f' duplicate={str(duplicate).lower()}'))
          except (OSError, ValueError, AssertionError):
              print('IOS_CPU_BENCHMARK_SUMMARY=unverified reason=log_capture_unverified')
          PYBENCH
          echo 'PHYSICAL_IPHONE_PIP_AUDIO_THERMAL_AND_HANDOFF_QUALIFICATION=not_run'
          echo 'UNSIGNED_DEVICE_BUILD_IS_NOT_PHYSICAL_EXECUTION=true'
          exit "$status"
