name: iOS 27 build and playback

"on":
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_ANALYTICS: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  ios-tests:
    name: iPhone generated inputs, simulator tests and unsigned device build
    runs-on: xcode-27
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source and SDK
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          echo "ACCEPTANCE_HEAD=$CANDIDATE_SHA"
          echo "ACCEPTANCE_TREE=$(git rev-parse HEAD^{tree})"
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = '27.0'
          test "$(xcrun --sdk iphonesimulator --show-sdk-version)" = '27.0'
      - name: Generate pinned inputs and compare committed bytes
        id: generated
        run: |
          brew install mint
          mint bootstrap
          python3 Scripts/emit-generated-ios-inputs.py capture --baseline "$RUNNER_TEMP/generated-before.json"
          xcodebuild -downloadComponent MetalToolchain
          Scripts/build-metal-libraries.sh --platform ios
          mint run yonaskolb/XcodeGen@2.44.1 xcodegen generate --spec project.yml --project . --project-root .
          python3 Scripts/emit-generated-ios-inputs.py emit --baseline "$RUNNER_TEMP/generated-before.json"
      - name: Prepare audited iOS dependency profile
        id: prepare
        timeout-minutes: 40
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          echo "ACCEPTANCE_HEAD=$CANDIDATE_SHA"
          echo "ACCEPTANCE_TREE=$(git rev-parse HEAD^{tree})"
          brew install jq
          Scripts/build-ffmpeg.sh --platform ios
          Scripts/audit-ffmpeg.sh --platform ios Vendor/FFmpeg/Artifacts-iOS/FFmpeg.xcframework
          Scripts/Tests/test_ffmpeg_artifact_audit.sh --platform ios
          Scripts/Tests/test_ffmpeg_reproducibility.sh --platform ios
          python3 Scripts/Tests/test_ios_artifact_profiles.py
          python3 Scripts/Tests/test_ios_platform_boundaries.py
          python3 Scripts/Tests/test_ios_target_structure.py
          python3 Scripts/Tests/test_cpu_video_processing.py
          python3 Scripts/Tests/test_ios_pip_contract.py
          python3 Scripts/Tests/test_ios_workflow.py
      - name: Choose an available iOS 27 iPhone simulator
        id: simulator
        run: |
          device="$(xcrun simctl list devices available -j | jq -r '
            .devices | to_entries[] | select(.key | contains("iOS-27-0")) |
            .value[] | select(.name | startswith("iPhone")) | .udid' | head -1)"
          test -n "$device"
          echo "IOS_TEST_DESTINATION=platform=iOS Simulator,id=$device" >> "$GITHUB_ENV"
      - name: Compile Release for a physical iPhone destination without signing
        timeout-minutes: 25
        run: |
          xcodebuild build -project VPlayer.xcodeproj -scheme VPlayeriOS \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/iOS-Device" CODE_SIGNING_ALLOWED=NO
      - name: Verify Release simulator cold starts without fixture bypass
        if: always() && !cancelled() && steps.prepare.outcome == 'success' && steps.simulator.outcome == 'success'
        timeout-minutes: 20
        run: |
          xcodebuild test -project VPlayer.xcodeproj -scheme VPlayeriOSReleaseStartup \
            -configuration Release -destination "$IOS_TEST_DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/iOS-Release" \
            -resultBundlePath "$RUNNER_TEMP/iOS-Release.xcresult" \
            CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO
      - name: Run shared playback and iPhone touch tests
        if: always() && !cancelled() && steps.prepare.outcome == 'success' && steps.simulator.outcome == 'success'
        timeout-minutes: 60
        run: |
          Scripts/test-ios.sh -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/iOS-Simulator" \
            -resultBundlePath "$RUNNER_TEMP/iOS.xcresult" \
            -parallel-testing-enabled NO -collect-test-diagnostics never \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300
      - name: Report test failures and qualification limits
        if: always()
        run: |
          python3 Scripts/report-xcresult-failures.py "$RUNNER_TEMP/iOS-Release.xcresult"
          python3 Scripts/report-xcresult-failures.py "$RUNNER_TEMP/iOS.xcresult"
          echo 'PHYSICAL_IPHONE_PIP_AUDIO_THERMAL_AND_HANDOFF_QUALIFICATION=not_run'
          echo 'UNSIGNED_DEVICE_BUILD_IS_NOT_PHYSICAL_EXECUTION=true'
      - name: Fail closed until generated outputs are committed
        if: always() && steps.generated.outputs.needs_refresh == 'true'
        run: |
          echo 'Native results above are diagnostic only: generated inputs differ from the committed tree.'
          echo 'Commit the verified generated outputs and validate the new exact head before acceptance.'
          exit 1
