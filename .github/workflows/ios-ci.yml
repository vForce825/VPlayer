name: iOS 27 build and playback

"on":
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_ANALYTICS: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  generated-inputs:
    name: Pinned iOS generated-input readback
    runs-on: xcode-27
    timeout-minutes: 15
    outputs:
      needs_refresh: ${{ steps.generated.outputs.needs_refresh }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source and generator SDK
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = '27.0'
          test "$(xcrun --sdk iphonesimulator --show-sdk-version)" = '27.0'
      - name: Diagnose cold simulator boot before compilation
        id: boot_probe
        continue-on-error: true
        timeout-minutes: 5
        run: |
          echo "IOS_BOOT_PROBE_HEAD=$(git rev-parse HEAD)"
          echo "IOS_BOOT_PROBE_TREE=$(git rev-parse HEAD^{tree})"
          echo "IOS_BOOT_PROBE_IMAGE=${ImageOS:-unavailable}"
          echo "IOS_BOOT_PROBE_IMAGE_VERSION=${ImageVersion:-unavailable}"
          python3 Scripts/Support/ios-startup-runner.py --boot-only
      - name: Record diagnostic cold boot outcome
        if: always() && !cancelled()
        timeout-minutes: 1
        env:
          PROBE_OUTCOME: ${{ steps.boot_probe.outcome }}
        run: |
          case "$PROBE_OUTCOME" in
            success) result=boot_ready_only ;;
            failure) result=failed ;;
            *) result=unverified ;;
          esac
          echo "IOS_BOOT_PROBE_STEP_OUTCOME=$PROBE_OUTCOME"
          echo "IOS_BOOT_PROBE_CLASSIFICATION=$result"
          echo 'IOS_BOOT_PROBE_APP_AND_XCTEST=not_run'
          printf 'Pre-compilation iOS boot diagnostic: %s (step outcome: %s). App and XCTest were not run. Full iOS acceptance remains required on its separate worker.\n' \
            "$result" "$PROBE_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
      - name: Generate pinned inputs and compare committed bytes
        id: generated
        run: |
          brew install mint
          mint bootstrap
          python3 Scripts/emit-generated-ios-inputs.py capture --baseline "$RUNNER_TEMP/generated-before.json"
          xcodebuild -downloadComponent MetalToolchain
          Scripts/build-metal-libraries.sh --platform ios
          mint run yonaskolb/XcodeGen@2.44.1 xcodegen generate --spec project.yml --project . --project-root .
          python3 Scripts/emit-generated-ios-inputs.py emit --baseline "$RUNNER_TEMP/generated-before.json"
      - name: Fail closed until generated outputs are committed
        if: steps.generated.outputs.needs_refresh == 'true'
        run: |
          echo 'Commit the verified generated outputs before native acceptance.'
          exit 1
  ios-tests:
    name: iPhone simulator tests and unsigned device build
    needs: generated-inputs
    if: ${{ needs.generated-inputs.outputs.needs_refresh == 'false' }}
    runs-on: xcode-27
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source and SDK
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          echo "ACCEPTANCE_HEAD=$CANDIDATE_SHA"
          echo "ACCEPTANCE_TREE=$(git rev-parse HEAD^{tree})"
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = '27.0'
          test "$(xcrun --sdk iphonesimulator --show-sdk-version)" = '27.0'
      - name: Prepare audited iOS dependency profile
        id: prepare
        timeout-minutes: 40
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          echo "ACCEPTANCE_HEAD=$CANDIDATE_SHA"
          echo "ACCEPTANCE_TREE=$(git rev-parse HEAD^{tree})"
          brew install jq ripgrep
          command -v rg
          xcodebuild -downloadComponent MetalToolchain
          Scripts/build-ffmpeg.sh --platform ios
          Scripts/audit-ffmpeg.sh --platform ios Vendor/FFmpeg/Artifacts-iOS/FFmpeg.xcframework
          Scripts/Tests/test_ffmpeg_artifact_audit.sh --platform ios
          Scripts/Tests/test_ffmpeg_reproducibility.sh --platform ios
          python3 Scripts/Tests/test_ios_artifact_profiles.py
          python3 Scripts/Tests/test_ios_platform_boundaries.py
          python3 Scripts/Tests/test_ios_target_structure.py
          python3 Scripts/Tests/test_cpu_video_processing.py
          python3 Scripts/Tests/test_ios_pip_contract.py
          python3 Scripts/Tests/test_samplebuffer_source_metadata.py
          python3 Scripts/Tests/test_ios_workflow.py
          python3 Scripts/Tests/test_ios_startup_runner.py
          python3 Scripts/Tests/test_paused_workspace_malloc.py
          python3 Scripts/Tests/test_ios_benchmark_contract.py
          python3 Scripts/Tests/test_ios_test_status_report.py
          python3 Scripts/Tests/test_ios_pip_runtime_report.py
      - name: Choose an available iOS 27 iPhone simulator
        id: simulator
        run: |
          device="$(xcrun simctl list devices available -j | jq -r '
            .devices | to_entries[] | select(.key | contains("iOS-27-0")) |
            .value[] | select(.name | startswith("iPhone")) | .udid' | head -1)"
          test -n "$device"
          echo "IOS_TEST_DESTINATION=platform=iOS Simulator,id=$device" >> "$GITHUB_ENV"
          echo "IOS_SIMULATOR_UDID=$device" >> "$GITHUB_ENV"
      - name: Compile Release for a physical iPhone destination without signing
        timeout-minutes: 25
        run: |
          xcodebuild build -project VPlayer.xcodeproj -scheme VPlayeriOS \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/iOS-Device" CODE_SIGNING_ALLOWED=NO
          python3 - <<'PYICON'
          import os, pathlib, plistlib
          app=pathlib.Path(os.environ['RUNNER_TEMP'])/'iOS-Device/Build/Products/Release-iphoneos/VPlayer.app'
          info=plistlib.loads((app/'Info.plist').read_bytes())
          assert info['CFBundleIdentifier']=='com.vforce.vplayer', 'Unexpected iPhone app identity'
          primary=info['CFBundleIcons']['CFBundlePrimaryIcon']
          assert primary['CFBundleIconName']=='AppIcon', 'iPhone AppIcon was not selected'
          assert primary['CFBundleIconFiles'], 'Compiled iPhone icon list is empty'
          for name in primary['CFBundleIconFiles']:
              assert any(p.stat().st_size for p in app.glob(name+'*.png')), 'Compiled icon image missing: '+name
          assert (app/'Assets.car').stat().st_size>0, 'Compiled asset catalog is missing'
          print('IOS_APP_IDENTITY_AND_ICON=passed')
          PYICON
      - name: Build Release simulator tests before booting the simulator
        id: release_build
        if: always() && !cancelled() && steps.prepare.outcome == 'success' && steps.simulator.outcome == 'success'
        timeout-minutes: 15
        run: |
          python3 Scripts/Support/ios-startup-runner.py --build-only \
            --simulator "$IOS_SIMULATOR_UDID" --derived-data "$RUNNER_TEMP/iOS-Release"
      - name: Verify Release simulator cold starts without fixture bypass
        if: always() && !cancelled() && steps.prepare.outcome == 'success' && steps.simulator.outcome == 'success' && steps.release_build.outcome == 'success'
        timeout-minutes: 20
        run: |
          python3 Scripts/Support/ios-startup-runner.py \
            --simulator "$IOS_SIMULATOR_UDID" --derived-data "$RUNNER_TEMP/iOS-Release"
      - name: Prepare mandatory synthetic shared-playback fixtures
        id: fixtures
        if: always() && !cancelled() && steps.prepare.outcome == 'success' && steps.simulator.outcome == 'success'
        timeout-minutes: 40
        run: |
          brew install pkgconf x264 x265 nasm
          tool_env="$(./Scripts/provision-hls-fixture-toolchain.sh)"
          source "$tool_env"
          ./Scripts/prepare-hls-ci-fixtures.sh --verify-committed
          test -s Tests/Fixtures/Video/synthetic-hlg50-ac3-64s.ts
      - name: Run shared playback and iPhone touch tests
        if: always() && !cancelled() && steps.prepare.outcome == 'success' && steps.simulator.outcome == 'success' && steps.fixtures.outcome == 'success'
        timeout-minutes: 60
        run: |
          set -o pipefail
          Scripts/test-ios.sh -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/iOS-Simulator" \
            -resultBundlePath "$RUNNER_TEMP/iOS.xcresult" \
            -parallel-testing-enabled NO -collect-test-diagnostics never \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 2>&1 | \
            python3 Scripts/report-ios-pip-runtime.py --candidate "$CANDIDATE_SHA"
      - name: Report startup and functional test results
        if: always()
        run: |
          status=0
          for bundle in iOS-RunnerControl iOS-Release iOS; do
            python3 Scripts/report-xcresult-failures.py "$RUNNER_TEMP/$bundle.xcresult" || status=1
          done
          python3 Scripts/report-ios-test-status.py "$RUNNER_TEMP/iOS.xcresult" || status=1
          exit "$status"
      - name: Measure optimized CPU processing without device qualification
        if: always() && !cancelled() && steps.prepare.outcome == 'success' && steps.simulator.outcome == 'success'
        timeout-minutes: 30
        run: |
          xcodebuild test -project VPlayer.xcodeproj -scheme VPlayeriOSBenchmarks \
            -configuration Release ENABLE_TESTABILITY=YES -enableCodeCoverage NO \
            -destination "$IOS_TEST_DESTINATION" CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath "$RUNNER_TEMP/iOS-CPU-Release" \
            -resultBundlePath "$RUNNER_TEMP/iOS-CPU-Release.xcresult" \
            -parallel-testing-enabled NO -collect-test-diagnostics never \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            -only-testing:VPlayeriOSBenchmarks/YADIFGoldenPixelTests/testCPUYADIFBenchmarkReportsNativeHostMeasurementsWithoutDeviceQualification
      - name: Report CPU measurement and qualification limits
        if: always()
        run: |
          status=0
          python3 Scripts/report-xcresult-failures.py "$RUNNER_TEMP/iOS-CPU-Release.xcresult" || status=1
          python3 Scripts/report-ios-test-status.py "$RUNNER_TEMP/iOS-CPU-Release.xcresult" --benchmark || status=1
          echo 'PHYSICAL_IPHONE_PIP_AUDIO_THERMAL_AND_HANDOFF_QUALIFICATION=not_run'
          echo 'UNSIGNED_DEVICE_BUILD_IS_NOT_PHYSICAL_EXECUTION=true'
          exit "$status"
