name: Foundation URL host round-trip diagnostic
"on":
  push:
    branches: [migration/tvos27]
permissions:
  contents: read
concurrency:
  group: macos-ci-host-roundtrip-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host-roundtrip:
    runs-on: xcode-27
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - name: Verify toolchain
        run: xcodebuild -version
      - name: Measure fixed synthetic Foundation URL round trips
        run: |
          cat > "$RUNNER_TEMP/host-roundtrip.swift" <<'SWIFT'
          import Foundation
          let original = URL(string: "http://127.0.0.1:12345/fixed")!
          let encodedHost = "%31%32%37.0.0.1"
          var parts = URLComponents(url: original, resolvingAgainstBaseURL: false)!
          parts.percentEncodedHost = encodedHost
          let assignedEncoded = parts.percentEncodedHost == encodedHost
          guard let componentURL = parts.url,
                let literalURL = URL(string: "http://%31%32%37.0.0.1:12345/fixed") else {
              fatalError("fixed synthetic URL construction failed")
          }
          func report(_ label: String, _ url: URL, _ assigned: Bool) {
              let absolute = url.absoluteString
              let roundTrip = URLComponents(string: absolute)!
              let literalHost = roundTrip.percentEncodedHost == "127.0.0.1"
              print("URI_HOST_ROUNDTRIP construction=\(label) assignedEncoded=\(assigned) absoluteRetainsEncoded=\(absolute.contains(encodedHost)) ingressLiteralHost=\(literalHost) urlEqualsOriginal=\(url == original) absoluteEqualsOriginal=\(absolute == original.absoluteString)")
          }
          report("components", componentURL, assignedEncoded)
          report("literal", literalURL, URLComponents(string: "http://%31%32%37.0.0.1:12345/fixed")!.percentEncodedHost == encodedHost)
          SWIFT
          xcrun swift "$RUNNER_TEMP/host-roundtrip.swift"
