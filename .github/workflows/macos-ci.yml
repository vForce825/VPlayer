name: macOS build and test

# Standard GitHub-hosted runners are free for this public repository.
# Do not add larger runners, artifact uploads, or persistent caches without
# reviewing their billing and storage implications.
"on":
  push:
    branches: [migration/tvos27]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Xcode 27.0 / tvOS 27.0
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      TVOS_TEST_DESTINATION: platform=tvOS Simulator,name=Apple TV 4K (3rd generation),OS=27.0
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Verify Xcode and simulator runtime
        run: |
          xcodebuild -version
          xcrun --sdk appletvsimulator --show-sdk-version
          xcrun simctl list runtimes
          xcrun simctl list devices available
          xcrun simctl list runtimes -j | jq -e '
            .runtimes[] |
            select(.identifier == "com.apple.CoreSimulator.SimRuntime.tvOS-27-0" and .isAvailable)
          '

      - name: Install build tooling
        run: brew install mint jq ripgrep

      - name: Build and audit pinned FFmpeg
        run: ./ci_scripts/ci_post_clone.sh

      - name: Install Apple Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Check deployment floors and precompiled Metal reproducibility
        run: |
          python3 Scripts/Tests/test_tvos27_deployment.py
          ./Scripts/Tests/test_precompiled_metal_library.sh

      - name: Compile complete Debug test targets for diagnostic isolation
        id: debug_build
        run: |
          ./Scripts/bootstrap.sh --check
          ./Scripts/verify-licenses.sh
          xcodebuild build-for-testing -project VPlayer.xcodeproj -scheme VPlayer \
            -destination "$TVOS_TEST_DESTINATION" CODE_SIGNING_ALLOWED=NO
      - name: Validate real fixed-capacity storage and payload lifetimes
        if: ${{ !cancelled() && steps.debug_build.outcome == 'success' }}
        run: |
          xcodebuild test-without-building -project VPlayer.xcodeproj -scheme VPlayer \
            -destination "$TVOS_TEST_DESTINATION" CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO -collect-test-diagnostics never \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            -resultBundlePath "$RUNNER_TEMP/DebugCapacity.xcresult" \
            -only-testing:VPlayerTests/Task9RuntimeCapacityTests
      - name: Report scoped capacity diagnostic failures
        if: ${{ always() }}
        run: python3 Scripts/report-xcresult-failures.py "$RUNNER_TEMP/DebugCapacity.xcresult"
      - name: Diagnose genuine finite Publisher terminal receipts
        if: ${{ !cancelled() && steps.debug_build.outcome == 'success' }}
        run: |
          xcodebuild test-without-building -project VPlayer.xcodeproj -scheme VPlayer \
            -destination "$TVOS_TEST_DESTINATION" CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO -collect-test-diagnostics never \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            -resultBundlePath "$RUNNER_TEMP/DebugPublisher.xcresult" \
            -only-testing:VPlayerTests/HLSPublisherTests/testInitialSixSevenAndEighthInvariantUseEachReceiptDuration \
            -only-testing:VPlayerTests/HLSPublisherTests/testNaturalEOFLastSegmentOrUniqueEndOnlyObeysGateAndTeardownDoesNotEnd \
            -only-testing:VPlayerTests/HLSPublisherTests/testReviewI2EOFDrainsTwoAndEightBacklogBeforeUniqueEndList \
            -only-testing:VPlayerTests/HLSPublisherTests/testReviewI4RejectsUnboundReportsWholeOffsetAndIllegalFirstShortWindow
      - name: Report scoped Publisher diagnostic failures
        if: ${{ always() }}
        run: python3 Scripts/report-xcresult-failures.py "$RUNNER_TEMP/DebugPublisher.xcresult"
      - name: Diagnose complete HLS classes without parallel workers
        if: ${{ !cancelled() && steps.debug_build.outcome == 'success' }}
        run: |
          xcodebuild test-without-building -project VPlayer.xcodeproj -scheme VPlayer \
            -destination "$TVOS_TEST_DESTINATION" CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO -collect-test-diagnostics never \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            -resultBundlePath "$RUNNER_TEMP/DebugHLS.xcresult" \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests \
            -only-testing:VPlayerTests/LoopbackHTTPServerTests \
            -only-testing:VPlayerTests/HLSPublisherTests
      - name: Report scoped HLS diagnostic failures
        if: ${{ always() }}
        run: python3 Scripts/report-xcresult-failures.py "$RUNNER_TEMP/DebugHLS.xcresult"
      - name: Diagnose control deadlines, original Stop joins and native PCM
        if: ${{ !cancelled() && steps.debug_build.outcome == 'success' }}
        run: |
          xcodebuild test-without-building -project VPlayer.xcodeproj -scheme VPlayer \
            -destination "$TVOS_TEST_DESTINATION" CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO -collect-test-diagnostics never \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            -resultBundlePath "$RUNNER_TEMP/DebugControl.xcresult" \
            -only-testing:VPlayerTests/VPlayerAppStartupTests/testChannelLogoCacheCancelsChunkedTransferAtFirstOverflowChunk \
            -only-testing:VPlayerTests/PlaybackAudioRouteServiceTests/testDestroyedSystemMonitorUnregistersItsOriginalObservers \
            -only-testing:VPlayerTests/VideoToolboxDecoderTests/testSourceGateHasNoYADIFImplementation \
            -only-testing:VPlayerTests/AudioServiceLeaseTests/testAuthoritativeProofEscrowExhaustsAt3472UntilLastRetiredAliasDeinitializes \
            -only-testing:VPlayerTests/AudioRenderPipelineTests/testActivateContinuityIslandFlushesAndCannotReplayPreviousIsland \
            -only-testing:VPlayerTests/AudioRenderPipelineTests/testFlushDuringFallbackRemovalNeverResurrectsFailedRendererAndCompletesPCM \
            -only-testing:VPlayerTests/Task10ControllerReviewTests/testMediaServicesResetPublishesNilBeforeOwnerRetiresThenPublishesDelayedSuccessor \
            -only-testing:VPlayerTests/Task10ControllerReviewTests/testPrepareFinalCommitPreemptedByResetOrInterruptionHandsOffWithoutDemuxTerminal \
            -only-testing:VPlayerTests/AudioOnlyItemSelectorTests/testBackendIntegrationWithAudioOnlySelector \
            -only-testing:VPlayerTests/PlaybackPipelineTests/testCompressedRetryBeforeSharedGateOpenRequiresReplacementAudioPreroll \
            -only-testing:VPlayerTests/PlaybackPipelineTests/testControllerMetricsProviderRetainsFailedSessionCollectorUntilExplicitStop \
            -only-testing:VPlayerTests/Task9ProductionDeadlineTests/testPlayWaitingForRealCleanupCannotConsumeANewerResetGate \
            -only-testing:VPlayerTests/PlaybackControllerTests/testExplicitStopClearsMetricsRetainedAfterFailure \
            -only-testing:VPlayerTests/PlaybackControllerTests/testUserResumeDuringInterruptionKeepsSystemPauseUntilOwnerEndsIt \
            -only-testing:VPlayerTests/SynchronousSafetyIngressTests/testControlEventFieldsUseTheirRegisteredIndependentDomains \
            -only-testing:VPlayerTests/SynchronousSafetyIngressTests/testEndedWithoutResumeKeepsVetoButEndsPhysicalInterruption \
            -only-testing:VPlayerTests/SynchronousSafetyIngressTests/testResetFoldPreservesFirstAnchorAndLatestRoot \
            -only-testing:VPlayerTests/SynchronousSafetyIngressTests/testResetOutsideInterruptionUsesSeparateFirstResetAnchor \
            -only-testing:VPlayerTests/HLSResourceStoreTests/testGlobal560688MiBAndInitialization64KiBBoundariesAreAtomic \
            -only-testing:VPlayerTests/AudioRenderPipelineTests/testCompressedAnchorReplayRebuildsPrerollFromCurrentQueueAcceptance \
            -only-testing:VPlayerTests/AudioRenderPipelineTests/testSynchronousReadinessAnchorPreparationReplaysOnceWithoutAnotherInput \
            -only-testing:VPlayerTests/AudioRenderPipelineTests/testCompressedPrerollDoesNotUseInflatedLogicalPacketDuration \
            -only-testing:VPlayerTests/AudioRenderPipelineTests/testCompressedPrerollDoesNotBridgeSubMillisecondPhysicalOutputGaps \
            -only-testing:VPlayerTests/AudioRenderPipelineTests/testCompressedPrerollRestartsAtPhysicalOutputGap \
            -only-testing:VPlayerTests/Task9ProductionDeadlineTests \
            -only-testing:VPlayerTests/FFmpegDemuxerTests/testRecorderRecognizesEveryTerminalBeforeWaiting \
            -only-testing:VPlayerTests/FFmpegDemuxerTests/testRecorderRetainsNonterminalBurstAndExactFailedTerminal \
            -only-testing:VPlayerTests/PlaybackControllerTests/testSuspendedStopClearsOnlyItsOriginalTerminalMetrics \
            -only-testing:VPlayerTests/Task9ReconstructedRegressionTests/testStopSuspendedAtWatchdogStillJoinsSameSessionTerminalCleanup \
            -only-testing:VPlayerTests/Task9ReconstructedRegressionTests/testObsoleteStopCannotJoinReplacementSessionTerminalCleanup \
            -only-testing:VPlayerTests/Task9ReconstructedRegressionTests/testPendingAcquisitionAudioKeysKeepAdmissionBoundaryAndHistoricalOrder \
            -only-testing:VPlayerTests/Task9ReconstructedRegressionTests/testPauseAndResumeDuringPhysicalAcquisitionDoNotCreateBackendCleanupOwner \
            -only-testing:VPlayerTests/NativeReceiverAdapterTests/testRealSDKPCMAudioReceiverEOFRegistrationResumeFlushAndRemoval
      - name: Report scoped control diagnostic failures
        if: ${{ always() }}
        run: python3 Scripts/report-xcresult-failures.py "$RUNNER_TEMP/DebugControl.xcresult"

      - name: Inspect Address Sanitizer support and run separate raw storage checks
        if: ${{ !cancelled() && steps.debug_build.outcome == 'success' }}
        timeout-minutes: 30
        run: |
          help="$(xcodebuild -help 2>&1)"
          if ! printf '%s\n' "$help" | grep -F -- '-enableAddressSanitizer'; then
            echo 'CI_ASAN_NOT_RUN=installed_xcodebuild_does_not_advertise_support'
            exit 0
          fi
          echo 'CI_ASAN_SUPPORT_VERIFIED=1'
          xcodebuild test -project VPlayer.xcodeproj -scheme VPlayer \
            -destination "$TVOS_TEST_DESTINATION" CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath "$RUNNER_TEMP/DerivedDataASan" \
            -enableAddressSanitizer YES -parallel-testing-enabled NO \
            -collect-test-diagnostics never -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 300 \
            -resultBundlePath "$RUNNER_TEMP/DebugASan.xcresult" \
            -only-testing:VPlayerTests/Task9RuntimeCapacityTests/testPipelineNativePayloadRoundTripsEveryErrorCaseAndRebindsBetweenDifferentTypes \
            -only-testing:VPlayerTests/Task9RuntimeCapacityTests/testPipelineNativeMediaPayloadPreservesAllOptionalAndFloatingPointBits \
            -only-testing:VPlayerTests/Task9RuntimeCapacityTests/testPipelineNativeBackendPayloadPreservesScopeAndReleasesItsChargedOwnerAfterMove \
            -only-testing:VPlayerTests/Task9RuntimeCapacityTests/testPipelineNativePayloadClearAndDeinitReleaseEachDiagnosticExactlyOnce \
            -only-testing:VPlayerTests/Task9RuntimeCapacityTests/testPipelinePayloadRingWrapsThirtyOneToZeroWithMixedNativeTypesInFIFOOrder \
            -only-testing:VPlayerTests/Task9RuntimeCapacityTests/testPipelinePayloadOverflowClearsAllReferencesDuringConcurrentProducers \
            -only-testing:VPlayerTests/Task9RuntimeCapacityTests/testPipelinePayloadRingReleasesQueuedReferencesAndDeinitializesAfterJoin
      - name: Report scoped Address Sanitizer test failures
        if: ${{ always() }}
        run: python3 Scripts/report-xcresult-failures.py "$RUNNER_TEMP/DebugASan.xcresult"

  release-validation:
    name: Release boundaries and cold startup
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      TVOS_TEST_DESTINATION: platform=tvOS Simulator,name=Apple TV 4K (3rd generation),OS=27.0
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Verify toolchain
        run: |
          xcodebuild -version
          test "$(xcrun --sdk appletvsimulator --show-sdk-version)" = "27.0"
      - name: Install build tooling
        run: brew install mint jq ripgrep
      - name: Build and audit pinned FFmpeg
        run: ./ci_scripts/ci_post_clone.sh
      - name: Verify committed project and licenses
        id: release_preflight
        run: |
          ./Scripts/bootstrap.sh --check
          ./Scripts/verify-licenses.sh
          python3 Scripts/Tests/test_tvos27_deployment.py
      - name: Run Release boundary suite
        run: |
          xcodebuild test -project VPlayer.xcodeproj -scheme VPlayerReleaseBoundaryTests -resultBundlePath "$RUNNER_TEMP/ReleaseBoundary.xcresult" \
            -destination "$TVOS_TEST_DESTINATION" CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES \
            -collect-test-diagnostics never -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300
      - name: Report scoped Release boundary failures
        if: ${{ always() }}
        run: python3 Scripts/report-xcresult-failures.py "$RUNNER_TEMP/ReleaseBoundary.xcresult"
      - name: Run Release startup suite
        if: ${{ !cancelled() && steps.release_preflight.outcome == 'success' }}
        run: |
          xcodebuild test -project VPlayer.xcodeproj -scheme VPlayerReleaseStartupTests -resultBundlePath "$RUNNER_TEMP/ReleaseStartup.xcresult" \
            -destination "$TVOS_TEST_DESTINATION" CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES \
            -collect-test-diagnostics never -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300
      - name: Report scoped Release startup failures
        if: ${{ always() }}
        run: python3 Scripts/report-xcresult-failures.py "$RUNNER_TEMP/ReleaseStartup.xcresult"
      - name: Check six Release cold starts including allocator accounting
        if: ${{ !cancelled() && steps.release_preflight.outcome == 'success' }}
        run: |
          TVOS_SIMULATOR_UDID="$(xcrun simctl list devices available -j | jq -er '
            .devices["com.apple.CoreSimulator.SimRuntime.tvOS-27-0"][] |
            select(.name == "Apple TV 4K (3rd generation)") | .udid' | head -n 1)"
          export TVOS_SIMULATOR_UDID
          simulator_state="$(xcrun simctl list devices available -j | jq -er --arg id "$TVOS_SIMULATOR_UDID" '
            .devices[][] | select(.udid == $id) | .state')"
          if [[ "$simulator_state" != "Booted" ]]; then
            xcrun simctl boot "$TVOS_SIMULATOR_UDID"
          fi
          xcrun simctl bootstatus "$TVOS_SIMULATOR_UDID" -b
          ./Scripts/test-release-startup.sh

  artifact-validation:
    name: FFmpeg audit and reproducibility regressions
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      TVOS_TEST_DESTINATION: platform=tvOS Simulator,name=Apple TV 4K (3rd generation),OS=27.0
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Verify toolchain
        run: |
          xcodebuild -version
          test "$(xcrun --sdk appletvsimulator --show-sdk-version)" = "27.0"
      - name: Install build tooling
        run: brew install mint jq ripgrep
      - name: Build and audit pinned FFmpeg
        run: ./ci_scripts/ci_post_clone.sh
      - name: Verify committed project and licenses
        run: |
          ./Scripts/bootstrap.sh --check
          ./Scripts/verify-licenses.sh
          python3 Scripts/Tests/test_tvos27_deployment.py
      - name: Run dependency lock, tamper, promotion and reproducibility regressions
        run: |
          ./Scripts/Tests/test_ffmpeg_lock.sh
          ./Scripts/Tests/test_ffmpeg_audit.sh
      - name: Test bootstrap and device-acceptance runner contracts without hardware
        run: |
          ./Scripts/test-bootstrap-check.sh
          ./Scripts/test-device-acceptance-signal.sh
          ./Scripts/test-device-acceptance-signing.sh
          python3 Scripts/Tests/test_release_startup_diagnostics.py
          python3 Scripts/Tests/test_xcresult_failure_report.py

  fixture-validation:
    name: HTTP playback and full-length 4K timeline fixtures
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      TVOS_TEST_DESTINATION: platform=tvOS Simulator,name=Apple TV 4K (3rd generation),OS=27.0
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Verify toolchain
        run: |
          xcodebuild -version
          test "$(xcrun --sdk appletvsimulator --show-sdk-version)" = "27.0"
      - name: Install build and fixture tooling
        run: brew install mint jq ripgrep ffmpeg
      - name: Build and audit pinned application FFmpeg
        run: ./ci_scripts/ci_post_clone.sh
      - name: Verify committed project and licenses
        run: |
          ./Scripts/bootstrap.sh --check
          ./Scripts/verify-licenses.sh
          python3 Scripts/Tests/test_tvos27_deployment.py
      - name: Check fixture runner, server and generator contracts
        run: |
          python3 Scripts/Tests/test_playback_fixture_runner.py
          python3 Scripts/Tests/test_timeline_fixture.py
          python3 Scripts/Support/fixture_server.py --self-test
          ./Scripts/run-playback-integration-tests.sh --self-test
          ./Scripts/generate-playback-fixtures.sh --self-test
      - name: Run HTTP playback and 900-second 4K timeline coverage
        timeout-minutes: 30
        run: |
          fixture_dir="$(mktemp -d "${RUNNER_TEMP}/vplayer-timeline.XXXXXX")"
          trap 'rm -rf "$fixture_dir"' EXIT
          python3 Scripts/generate-timeline-fixture.py "$fixture_dir/timeline.ts"
          ./Scripts/run-playback-integration-tests.sh \
            --timeline-fixture "$fixture_dir/timeline.ts" \
            --only-testing VPlayerTests/PlaybackFixtureIntegrationTests \
            --only-testing VPlayerTests/AudioRenderPipelineTests/testTask22FCAllocationAdmissionReservesBeforeNativeCopiesAndReleasesAtFreePoints \
            --only-testing VPlayerTests/AudioRenderPipelineTests/testTask22FCNativeAllocationFailureAndFailedPushCannotMasqueradeAsEOFTail \
            --only-testing VPlayerTests/HLSTimelineTests \
            -- -parallel-testing-enabled NO -collect-test-diagnostics never -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300
