name: Intermediate exact-endpoint and cleanup regression

# Standard GitHub-hosted runners are free for this public repository.
# No larger runners, uploaded artifacts, persistent caches, retries or releases.
"on":
  push:
    branches: [migration/tvos27]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-ci-focused-${{ github.sha }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
  TVOS_TEST_DESTINATION: platform=tvOS Simulator,name=Apple TV 4K (3rd generation),OS=27.0
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_ANALYTICS: "1"
  PYTHONDONTWRITEBYTECODE: "1"

# Intermediate only: independent jobs, no retries and no hidden failures.
jobs:
  focused-debug:
    name: Compile all Debug targets and run affected regressions
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/migration/tvos27' }}
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Check out the exact acceptance head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify source, Xcode and tvOS SDK
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "ACCEPTANCE_HEAD=$GITHUB_SHA"
          xcodebuild -version
          test "$(xcodebuild -version | head -n 1)" = "Xcode 27.0"
          test "$(xcrun --sdk appletvsimulator --show-sdk-version)" = "27.0"
      - name: Prepare pinned application dependencies and build tools
        id: prepare
        timeout-minutes: 20
        run: |
          brew install mint jq ripgrep
          xcrun simctl list runtimes -j | jq -e '
            .runtimes[] |
            select(.identifier == "com.apple.CoreSimulator.SimRuntime.tvOS-27-0" and .isAvailable)
          '
          ./ci_scripts/ci_post_clone.sh
          xcodebuild -downloadComponent MetalToolchain
          ./Scripts/bootstrap.sh --check
          ./Scripts/verify-licenses.sh
      - name: Label intermediate coverage and remaining acceptance
        if: ${{ !cancelled() }}
        run: |
          echo 'CI_ACCEPTANCE_COMPLETE=0'
          echo 'CI_DEBUG_COMPILATION=all_VPlayer_unit_and_UI_targets'
          echo 'CI_DEBUG_EXECUTION=affected_classes_and_selected_writer_regressions'
          echo 'CI_FULL_DEBUG_EXECUTION=not_run_in_this_intermediate_gate'
          echo 'CI_RELEASE_STARTUP_AND_COLD=not_run_in_this_intermediate_gate'
          echo 'CI_ASAN_AND_STRICT_HTTP_900S4K=not_run_in_this_intermediate_gate'
          echo 'CI_KNOWN_NATIVE_PROBE_LIMITS=remain_visible_failures_not_output_proof'
          echo 'CI_FINAL_COMPLETE_WORKFLOW=retained_and_still_required'
      - name: Compile all Debug unit and UI test targets
        id: debug_build
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        timeout-minutes: 20
        run: |
          xcodebuild build-for-testing -project VPlayer.xcodeproj -scheme VPlayer \
            -configuration Debug -destination "$TVOS_TEST_DESTINATION" CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath "$RUNNER_TEMP/Focused-Debug"
      - name: Run complete affected classes and exact writer regressions
        if: ${{ !cancelled() && steps.debug_build.outcome == 'success' }}
        timeout-minutes: 15
        run: |
          # Entire classes retain functional assertions and capability failures.
          xcodebuild test-without-building -project VPlayer.xcodeproj -scheme VPlayer \
            -configuration Debug -destination "$TVOS_TEST_DESTINATION" CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath "$RUNNER_TEMP/Focused-Debug" \
            -resultBundlePath "$RUNNER_TEMP/Focused-Debug.xcresult" \
            -parallel-testing-enabled NO -collect-test-diagnostics never \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests \
            -only-testing:VPlayerTests/LoopbackHTTPServerTests \
            -only-testing:VPlayerTests/AVPlayerSDKCallbackCreditPoolTests \
            -only-testing:VPlayerTests/ControlTaskRegistryTests \
            -only-testing:VPlayerTests/SegmentedFMP4WriterTests/testPausedPrefixResumesAuthenticatedFinalTailAfterIncrementalFinalization \
            -only-testing:VPlayerTests/SegmentedFMP4WriterTests/testPausedFinalizedTailPreservesNanosecondCursorWithUnrepresentableDuration \
            -only-testing:VPlayerTests/SegmentedFMP4WriterTests/testCurrentFinalVideoProjectionAuthenticatesLogicalScopeAcrossRealWriterRollover
      - name: Report focused Debug outcomes and failures
        if: ${{ always() }}
        timeout-minutes: 3
        run: python3 Scripts/report-xcresult-failures.py "$RUNNER_TEMP/Focused-Debug.xcresult"

  release-boundaries:
    name: All established optimized Release boundary tests only
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/migration/tvos27' }}
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Check out the exact acceptance head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify source, Xcode and tvOS SDK
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "ACCEPTANCE_HEAD=$GITHUB_SHA"
          xcodebuild -version
          test "$(xcodebuild -version | head -n 1)" = "Xcode 27.0"
          test "$(xcrun --sdk appletvsimulator --show-sdk-version)" = "27.0"
      - name: Prepare pinned application dependencies and build tools
        id: prepare
        timeout-minutes: 20
        run: |
          brew install mint jq ripgrep
          xcrun simctl list runtimes -j | jq -e '
            .runtimes[] |
            select(.identifier == "com.apple.CoreSimulator.SimRuntime.tvOS-27-0" and .isAvailable)
          '
          ./ci_scripts/ci_post_clone.sh
          xcodebuild -downloadComponent MetalToolchain
          ./Scripts/bootstrap.sh --check
          ./Scripts/verify-licenses.sh
      - name: Label the exact Release coverage
        if: ${{ !cancelled() }}
        run: |
          echo 'CI_RELEASE_COVERAGE=complete_established_boundary_suite_only'
          echo 'CI_RELEASE_STARTUP_AND_COLD=not_run_in_this_intermediate_gate'
          echo 'CI_FULL_RELEASE_UNIT_UI=unsupported_existing_harness_not_run'
      - name: Run all optimized Release boundary tests
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        timeout-minutes: 20
        run: |
          xcodebuild test -project VPlayer.xcodeproj -scheme VPlayerReleaseBoundaryTests \
            -configuration Release ENABLE_TESTABILITY=YES \
            -derivedDataPath "$RUNNER_TEMP/ReleaseBoundary" \
            -resultBundlePath "$RUNNER_TEMP/ReleaseBoundary.xcresult" \
            -destination "$TVOS_TEST_DESTINATION" CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO -collect-test-diagnostics never \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300
      - name: Report optimized boundary failures
        if: ${{ always() }}
        timeout-minutes: 3
        run: python3 Scripts/report-xcresult-failures.py "$RUNNER_TEMP/ReleaseBoundary.xcresult"

  compiler-controls:
    name: Artifact-local compiler controls (no production allocation proof)
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/migration/tvos27' }}
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - name: Check out the exact acceptance head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify source, Xcode and tvOS SDK
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "ACCEPTANCE_HEAD=$GITHUB_SHA"
          xcodebuild -version
          test "$(xcodebuild -version | head -n 1)" = "Xcode 27.0"
          test "$(xcrun --sdk appletvsimulator --show-sdk-version)" = "27.0"
      - name: Validate exact-toolchain Debug and Release control artifacts
        timeout-minutes: 5
        run: |
          # The script checks exact Swift identity, report bounds and both
          # configurations. Success does not establish app slab/peak allocation.
          bash Scripts/run-paused-async-context-controls.sh
