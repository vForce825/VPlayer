  compiler-controls:
    name: Artifact-local compiler controls (no production allocation proof)
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - name: Check out the exact acceptance head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify source, Xcode and tvOS SDK
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          echo "ACCEPTANCE_HEAD=$CANDIDATE_SHA"
          echo "ACCEPTANCE_TREE=$(git rev-parse HEAD^{tree})"
          xcodebuild -version
          xcode_version="$(xcodebuild -version)"
          test "${xcode_version%%$'\n'*}" = 'Xcode 27.0'
          test "$(xcrun --sdk appletvsimulator --show-sdk-version)" = "27.0"
      - name: Validate exact-toolchain Debug and Release control artifacts
        timeout-minutes: 5
        run: |
          # The script checks exact Swift identity, report bounds and both
          # configurations. Success does not establish app slab/peak allocation.
          bash Scripts/run-paused-async-context-controls.sh
