name: macOS build and test

# Standard GitHub-hosted runners are free for this public repository.
# Do not add larger runners, artifact uploads, or persistent caches without
# reviewing their billing and storage implications.
"on":
  push:
    branches: [migration/tvos27-checkpoint]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Xcode 27.0 / tvOS 27.0
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      TVOS_TEST_DESTINATION: platform=tvOS Simulator,name=Apple TV 4K (3rd generation),OS=27.0
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Verify Xcode and simulator runtime
        run: |
          xcodebuild -version
          xcrun --sdk appletvsimulator --show-sdk-version
          xcrun simctl list runtimes
          xcrun simctl list devices available
          xcrun simctl list runtimes -j | jq -e '
            .runtimes[] |
            select(.identifier == "com.apple.CoreSimulator.SimRuntime.tvOS-27-0" and .isAvailable)
          '

      - name: Install build tooling
        run: brew install mint jq ripgrep

      - name: Build and audit pinned FFmpeg
        run: ./ci_scripts/ci_post_clone.sh

      - name: Install official Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Rebuild tvOS 27 Metal libraries
        run: ./Scripts/build-metal-libraries.sh

      - name: Generate project for SDK migration diagnostic
        run: ./Scripts/bootstrap.sh --generate

      - name: Export bounded generated outputs to build log
        run: |
          python3 - <<'PY'
          import base64, hashlib, pathlib, subprocess
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          print("GENERATED_SOURCE_COMMIT=" + commit)
          print("GENERATED_LOCAL_SOURCE_COMMIT=f45a1b6033b2fce3eed7f3eeced74778c9c33363")
          paths = [
              "VPlayer.xcodeproj/project.pbxproj",
              "Sources/VPlayerPlayback/Resources/VPlayerPlayback-tvos.metallib",
              "Sources/VPlayerPlayback/Resources/VPlayerPlayback-tvsimulator.metallib",
          ]
          total = 0
          for name in paths:
              data = pathlib.Path(name).read_bytes()
              total += len(data)
              if total > 1048576:
                  raise SystemExit("Generated outputs exceed bounded 1 MiB log export")
              print("GENERATED_BEGIN " + name)
              print("GENERATED_BYTES=" + str(len(data)))
              print("GENERATED_SHA256=" + hashlib.sha256(data).hexdigest())
              encoded = base64.b64encode(data).decode()
              for offset in range(0, len(encoded), 120):
                  print("GENERATED_BASE64=" + encoded[offset:offset + 120])
              print("GENERATED_END " + name)
          PY

      - name: Compile tvOS 27 app and tests
        run: |
          xcodebuild build-for-testing \
            -project VPlayer.xcodeproj \
            -scheme VPlayer \
            -destination "$TVOS_TEST_DESTINATION" \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify bounded XCTest timeout options
        run: |
          help="$(xcodebuild -help 2>&1)"
          for option in -test-timeouts-enabled -default-test-execution-time-allowance -maximum-test-execution-time-allowance; do
            printf '%s\n' "$help" | grep -F -- "$option"
          done

      - name: Run bounded focused migration and writer regression suites
        run: |
          ./Scripts/bootstrap.sh --check
          ./Scripts/verify-licenses.sh
          python3 - <<'PY'
          import os, re, selectors, signal, subprocess, sys, time
          
          command = [
              "xcodebuild", "test-without-building", "-project", "VPlayer.xcodeproj",
              "-scheme", "VPlayer", "-destination", os.environ["TVOS_TEST_DESTINATION"],
              "-parallel-testing-enabled", "NO", "-test-timeouts-enabled", "YES",
              "-default-test-execution-time-allowance", "120",
              "-maximum-test-execution-time-allowance", "300",
              "-only-testing:VPlayerTests/AudioSessionLifecycleTests",
              "-only-testing:VPlayerTests/SystemAudioSessionConfiguratorTests",
              "-only-testing:VPlayerTests/NativeReceiverAdapterTests",
              "-only-testing:VPlayerTests/AudioRendererRecoveryProgressTests",
              "-only-testing:VPlayerTests/SystemVideoOutputTests",
              "-only-testing:VPlayerTests/AVPlayerAsyncLogReaderTests",
              "-only-testing:VPlayerTests/AVPlayerLogSnapshotCacheTests",
              "-only-testing:VPlayerTests/RefreshLifecycleTests",
              "-only-testing:VPlayerTests/NowPlayingIntegrationTests",
              "-only-testing:VPlayerTests/CommittedLibraryObservationTests",
              "-only-testing:VPlayerTests/ReducedResourceUsageTests",
              "-only-testing:VPlayerTests/SegmentedFMP4WriterTests",
              "-only-testing:VPlayerTests/AACPrimingCalibratorTests",
              "CODE_SIGNING_ALLOWED=NO",
          ]
          process = subprocess.Popen(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, start_new_session=True)
          selector = selectors.DefaultSelector()
          selector.register(process.stdout, selectors.EVENT_READ)
          started = time.monotonic()
          completed_at = None
          buffer = b""
          
          def emit(line):
              global completed_at
              print(line, flush=True)
              if re.search(r"Test Suite 'Selected tests' (passed|failed) at", line):
                  completed_at = time.monotonic()
                  print("CI_POST_SUITE_WATCHDOG: suite completion observed; allowing 180 seconds for finalization", flush=True)
          
          def diagnose():
              print("CI_POST_SUITE_WATCHDOG: owned process did not exit; preserving failure", flush=True)
              listing = subprocess.check_output(["ps", "-ax", "-o", "pid=,ppid=,stat=,etime=,comm="], text=True)
              rows = []
              for line in listing.splitlines():
                  parts = line.split(None, 4)
                  if len(parts) == 5:
                      rows.append((int(parts[0]), int(parts[1]), parts[4], line))
              owned = {process.pid}
              while True:
                  descendants = owned | {pid for pid, parent, _, _ in rows if parent in owned}
                  if descendants == owned:
                      break
                  owned = descendants
              relevant = [(pid, command, line) for pid, parent, command, line in rows
                          if pid in owned or os.path.basename(command).startswith("VPlayer")]
              for _, _, line in relevant:
                  print("CI_PROCESS " + line, flush=True)
              subprocess.run(["xcrun", "simctl", "list", "devices", "booted", "--json"], timeout=20, check=False)
              sample_pids = [process.pid] + [pid for pid, command, _ in relevant
                                            if pid != process.pid and os.path.basename(command).startswith("VPlayer")][:3]
              for pid in sample_pids:
                  print("CI_PROCESS_SAMPLE " + str(pid), flush=True)
                  try:
                      sample = subprocess.run(["sample", str(pid), "3", "1"], capture_output=True, text=True, timeout=15)
                      print("\n".join((sample.stdout + sample.stderr).splitlines()[:400]), flush=True)
                  except subprocess.TimeoutExpired:
                      print("CI_PROCESS_SAMPLE timed out", flush=True)
          
          while True:
              for key, _ in selector.select(timeout=1):
                  chunk = os.read(key.fileobj.fileno(), 65536)
                  if not chunk:
                      selector.unregister(key.fileobj)
                      continue
                  buffer += chunk
                  while b"\n" in buffer:
                      line, buffer = buffer.split(b"\n", 1)
                      emit(line.decode("utf-8", errors="replace"))
              if process.poll() is not None:
                  if buffer:
                      emit(buffer.decode("utf-8", errors="replace"))
                  raise SystemExit(process.returncode)
              now = time.monotonic()
              if (completed_at is not None and now - completed_at > 180) or now - started > 1800:
                  diagnose()
                  os.killpg(process.pid, signal.SIGTERM)
                  try:
                      process.wait(timeout=10)
                  except subprocess.TimeoutExpired:
                      os.killpg(process.pid, signal.SIGKILL)
                      process.wait(timeout=10)
                  raise SystemExit(124)
          
          PY
