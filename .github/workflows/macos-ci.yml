name: Owned pause cursor and physical callback tail validation

# Standard GitHub-hosted runners are free for this public repository.
# Do not add larger runners, artifact uploads, or persistent caches without
# reviewing their billing and storage implications.
"on":
  push:
    branches: [migration/tvos27]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-ci-cursor-tail-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Xcode 27.0 / tvOS 27.0
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      TVOS_TEST_DESTINATION: platform=tvOS Simulator,name=Apple TV 4K (3rd generation),OS=27.0
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Verify Xcode and simulator runtime
        run: |
          xcodebuild -version
          xcrun --sdk appletvsimulator --show-sdk-version
          xcrun simctl list runtimes
          xcrun simctl list devices available
          xcrun simctl list runtimes -j | jq -e '
            .runtimes[] |
            select(.identifier == "com.apple.CoreSimulator.SimRuntime.tvOS-27-0" and .isAvailable)
          '

      - name: Install build tooling
        run: brew install mint jq ripgrep

      - name: Build and audit pinned FFmpeg
        run: ./ci_scripts/ci_post_clone.sh

      - name: Install Apple Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Check deployment floors and precompiled Metal reproducibility
        run: |
          python3 Scripts/Tests/test_tvos27_deployment.py
          ./Scripts/Tests/test_precompiled_metal_library.sh

      - name: Compile complete Debug test targets for diagnostic isolation
        id: debug_build
        run: |
          ./Scripts/bootstrap.sh --check
          ./Scripts/verify-licenses.sh
          xcodebuild build-for-testing -project VPlayer.xcodeproj -scheme VPlayer \
            -destination "$TVOS_TEST_DESTINATION" CODE_SIGNING_ALLOWED=NO
      - name: Verify cursor, credits and unchanged capacity contracts
        if: ${{ !cancelled() && steps.debug_build.outcome == 'success' }}
        run: |
          set -o pipefail
          xcodebuild test-without-building -project VPlayer.xcodeproj -scheme VPlayer \
            -destination "$TVOS_TEST_DESTINATION" CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO -collect-test-diagnostics never \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            -resultBundlePath "$RUNNER_TEMP/CursorCapacity.xcresult" \
            -only-testing:VPlayerTests/Task9RuntimeCapacityTests \
            -only-testing:VPlayerTests/HLSCapacityTests \
            -only-testing:VPlayerTests/AVPlayerSDKCallbackCreditPoolTests \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testOwnedPauseCursorSystemReadRejectsInvalidTimeAndStaleNativeItemWithoutNewBudget \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testOwnedPauseCursorContractRejectsUnsettledConnectionAndNonpausedState \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testOwnedPauseCursorCapturesBeforeDisconnectAndRepeatedStopPreservesOriginalBinding \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testOwnedPauseCursorInvalidOrUnavailableReadDoesNotBlockPhysicalStopOrTeardown \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testOwnedPauseCursorCanceledCallerStillJoinsTheOriginalSuccessfulPhysicalStop \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testOwnedPauseCursorFailedOriginalStopCannotPublishOrRetryItsCapturedTime \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testOwnedPauseCursorCanceledPredecessorReadCannotCommitAgainstSuccessorItem \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testOwnedPauseCursorInvalidationDuringDisconnectCannotPublishTheLocalSample \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testOwnedPauseCursorFailureInvalidatesAcceptedBindingBeforeRetirement \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testOwnedPauseCursorPriorValidBindingCannotSurviveNewUnavailableCaptureOrReplay \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testOwnedPauseCursorAcceptedResumeRetiresPredecessorAndLateStopCannotOverwriteSuccessor \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testReview2CoordinatorFixedCapacityRejectsBeforeInstallationAndOwnsOneWaiterWithoutTimer
      - name: Report scoped CursorCapacity failures
        if: ${{ always() }}
        run: python3 Scripts/report-xcresult-failures.py "$RUNNER_TEMP/CursorCapacity.xcresult"

      - name: Verify startup store and full loopback coverage contracts
        if: ${{ !cancelled() && steps.debug_build.outcome == 'success' }}
        run: |
          set -o pipefail
          xcodebuild test-without-building -project VPlayer.xcodeproj -scheme VPlayer \
            -destination "$TVOS_TEST_DESTINATION" CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO -collect-test-diagnostics never \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            -resultBundlePath "$RUNNER_TEMP/CursorStore.xcresult" \
            -only-testing:VPlayerTests/HLSResourceStoreTests \
            -only-testing:VPlayerTests/LoopbackHTTPServerTests \
            -only-testing:VPlayerTests/VPlayerAppStartupTests \
            -only-testing:VPlayerTests/PausedWindowCoverageLeaseTests
      - name: Report scoped CursorStore failures
        if: ${{ always() }}
        run: python3 Scripts/report-xcresult-failures.py "$RUNNER_TEMP/CursorStore.xcresult"

      - name: Verify native callback tails in a fresh invocation
        if: ${{ !cancelled() && steps.debug_build.outcome == 'success' }}
        run: |
          set -o pipefail
          xcodebuild test-without-building -project VPlayer.xcodeproj -scheme VPlayer \
            -destination "$TVOS_TEST_DESTINATION" CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO -collect-test-diagnostics never \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            -resultBundlePath "$RUNNER_TEMP/NativeTails.xcresult" \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testTVOS27NativePreparationCallbackTailsRetireBeforeNextOperation 2>&1 | tee "$RUNNER_TEMP/native-tails.log"
      - name: Report scoped NativeTails failures
        if: ${{ always() }}
        run: python3 Scripts/report-xcresult-failures.py "$RUNNER_TEMP/NativeTails.xcresult"

      - name: Require actual native callback-tail execution without skips
        if: ${{ !cancelled() && steps.debug_build.outcome == 'success' }}
        run: |
          python3 - "$RUNNER_TEMP/native-tails.log" <<'PY'
          import pathlib, re, sys
          text = pathlib.Path(sys.argv[1]).read_text()
          pattern = r"Test Case '-\[VPlayerTests\.AVPlayerItemCoordinatorTests testTVOS27NativePreparationCallbackTailsRetireBeforeNextOperation\]' (passed|failed|skipped|exceeded execution)"
          states = re.findall(pattern, text)
          if states != ["passed"] or not re.search(r"Executed 1 test, with 0 failures", text):
              raise SystemExit(f"NATIVE_TAIL_GATE_FAILED outcomes={states}")
          print("NATIVE_TAIL_GATE executed=1 passed=1 skipped=0")
          PY

      - name: Diagnose authenticated native direct preparation body completion
        if: ${{ !cancelled() && steps.debug_build.outcome == 'success' }}
        run: |
          set -o pipefail
          xcodebuild test-without-building -project VPlayer.xcodeproj -scheme VPlayer \
            -destination "$TVOS_TEST_DESTINATION" CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO -collect-test-diagnostics never \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            -resultBundlePath "$RUNNER_TEMP/NativeDirect.xcresult" \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testRealAVPlayerLoopbackRequestsPlaylistInitMediaAndPreparesAtRateZero
      - name: Report scoped NativeDirect failures
        if: ${{ always() }}
        run: python3 Scripts/report-xcresult-failures.py "$RUNNER_TEMP/NativeDirect.xcresult"

      - name: Validate cursor, metadata and credits under Address Sanitizer
        if: ${{ !cancelled() && steps.debug_build.outcome == 'success' }}
        run: |
          xcodebuild -help > "$RUNNER_TEMP/xcodebuild-help.txt" 2>&1
          grep -q -- '-enableAddressSanitizer' "$RUNNER_TEMP/xcodebuild-help.txt"
          xcodebuild test -project VPlayer.xcodeproj -scheme VPlayer \
            -destination "$TVOS_TEST_DESTINATION" CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath "$RUNNER_TEMP/CursorASan" -enableAddressSanitizer YES \
            -parallel-testing-enabled NO -collect-test-diagnostics never \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            -resultBundlePath "$RUNNER_TEMP/CursorASan.xcresult" \
            -only-testing:VPlayerTests/AVPlayerSDKCallbackCreditPoolTests \
            -only-testing:VPlayerTests/PausedWindowCoverageLeaseTests \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testOwnedPauseCursorSystemReadRejectsInvalidTimeAndStaleNativeItemWithoutNewBudget \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testOwnedPauseCursorContractRejectsUnsettledConnectionAndNonpausedState \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testOwnedPauseCursorCapturesBeforeDisconnectAndRepeatedStopPreservesOriginalBinding \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testOwnedPauseCursorInvalidOrUnavailableReadDoesNotBlockPhysicalStopOrTeardown \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testOwnedPauseCursorCanceledCallerStillJoinsTheOriginalSuccessfulPhysicalStop \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testOwnedPauseCursorFailedOriginalStopCannotPublishOrRetryItsCapturedTime \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testOwnedPauseCursorCanceledPredecessorReadCannotCommitAgainstSuccessorItem \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testOwnedPauseCursorInvalidationDuringDisconnectCannotPublishTheLocalSample \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testOwnedPauseCursorFailureInvalidatesAcceptedBindingBeforeRetirement \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testOwnedPauseCursorPriorValidBindingCannotSurviveNewUnavailableCaptureOrReplay \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testOwnedPauseCursorAcceptedResumeRetiresPredecessorAndLateStopCannotOverwriteSuccessor
      - name: Report scoped cursor Address Sanitizer failures
        if: ${{ always() }}
        run: python3 Scripts/report-xcresult-failures.py "$RUNNER_TEMP/CursorASan.xcresult"
