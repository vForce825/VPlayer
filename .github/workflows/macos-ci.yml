name: Prefix finality and exact owner cancellation

# Standard GitHub-hosted runners are free for this public repository.
# Do not add larger runners, artifact uploads, or persistent caches without
# reviewing their billing and storage implications.
"on":
  push:
    branches: [migration/tvos27]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-ci-native-reference-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Xcode 27.0 / tvOS 27.0
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      TVOS_TEST_DESTINATION: platform=tvOS Simulator,name=Apple TV 4K (3rd generation),OS=27.0
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Verify Xcode and simulator runtime
        run: |
          xcodebuild -version
          xcrun --sdk appletvsimulator --show-sdk-version
          xcrun simctl list runtimes
          xcrun simctl list devices available
          xcrun simctl list runtimes -j | jq -e '
            .runtimes[] |
            select(.identifier == "com.apple.CoreSimulator.SimRuntime.tvOS-27-0" and .isAvailable)
          '

      - name: Install build tooling
        run: brew install mint jq ripgrep ffmpeg

      - name: Build and audit pinned FFmpeg
        run: ./ci_scripts/ci_post_clone.sh

      - name: Install Apple Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Check deployment floors and precompiled Metal reproducibility
        id: debug_preflight
        run: |
          python3 Scripts/Tests/test_tvos27_deployment.py
          ./Scripts/Tests/test_precompiled_metal_library.sh

      - name: Inspect the exact Swift toolchain ABI availability
        run: |
          xcrun swiftc --version
          toolchain="$(dirname "$(dirname "$(xcrun --find swiftc)")")"
          found=0
          while IFS= read -r header; do
            found=1
            echo "SWIFT_EXECUTOR_ABI_HEADER_BEGIN $header"
            shasum -a 256 "$header"
            sed -n '/class AsyncFunctionPointer/,/^};/p' "$header"
            echo "SWIFT_EXECUTOR_ABI_HEADER_END"
          done < <(find "$toolchain" -type f -path '*/swift/ABI/Executor.h')
          echo "SWIFT_EXECUTOR_ABI_HEADER_FOUND=$found"
      - name: Inspect native allocation capture tools
        run: |
          if xcrun --find xctrace >/dev/null 2>&1; then
            xcrun xctrace list templates || echo "NATIVE_ALLOCATION_CAPTURE_TEMPLATE_LIST_FAILED=1"
            xcrun xctrace help record || echo "NATIVE_ALLOCATION_CAPTURE_RECORD_HELP_FAILED=1"
            xcrun xctrace help export || echo "NATIVE_ALLOCATION_CAPTURE_EXPORT_HELP_FAILED=1"
          else
            echo "NATIVE_ALLOCATION_CAPTURE_XCTRACE_UNAVAILABLE=1"
          fi
          for tool in heap leaks malloc_history notifyutil; do
            command -v "$tool" || true
          done
      - name: Compile complete Debug targets
        id: debug_build
        run: |
          ./Scripts/bootstrap.sh --check
          ./Scripts/verify-licenses.sh
          xcodebuild build-for-testing -project VPlayer.xcodeproj -scheme VPlayer \
            -destination "$TVOS_TEST_DESTINATION" CODE_SIGNING_ALLOWED=NO
      - name: Validate artifact-local async context controls
        if: ${{ !cancelled() && steps.debug_build.outcome == 'success' }}
        timeout-minutes: 5
        run: bash Scripts/run-paused-async-context-controls.sh
      - name: Validate PausedResume
        if: ${{ !cancelled() && steps.debug_build.outcome == 'success' }}
        run: |
          xcodebuild test-without-building -project VPlayer.xcodeproj -scheme VPlayer \
            -destination "$TVOS_TEST_DESTINATION" CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO -collect-test-diagnostics never \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            -resultBundlePath "$RUNNER_TEMP/PausedResume.xcresult" \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testPausedResumeRestoresOwnedCursorAfterReconnectWithoutChangingTimeline \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testPausedResumeWithoutOwnedCursorRejectsBeforeReconnect \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testPausedResumeRevalidatesPublicationAfterExactSeekAwait \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testPausedResumeCancellationDuringExactSeekSettlesDisconnectedWithoutPlaying \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testPausedResumeCapacityFailureRejectsBeforeReconnect \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testRegistryPauseResumePauseReusesPreparedItemButRetiresOldReceipt \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testStorageReadinessChecksOriginalURLGenerationAndSequenceAtBindAndRevalidation
      - name: Report PausedResume failures
        if: ${{ always() }}
        run: python3 Scripts/report-xcresult-failures.py "$RUNNER_TEMP/PausedResume.xcresult"
      - name: Validate PausedReviewRegressions
        if: ${{ !cancelled() && steps.debug_build.outcome == 'success' }}
        run: |
          xcodebuild test-without-building -project VPlayer.xcodeproj -scheme VPlayer \
            -destination "$TVOS_TEST_DESTINATION" CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO -collect-test-diagnostics never \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            -resultBundlePath "$RUNNER_TEMP/PausedReviewRegressions.xcresult" \
            -only-testing:VPlayerTests/LoopbackHTTPServerTests/testPausedResumeDecodePinsExcludeUnfetchedNoncontributingVideoHold \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testPausedResumePreservesSeekFailureWhenRollbackAlsoFails \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testPausedResumeRejectsLatchedSourceFailureWhilePaused \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testPausedResumeRejectsLatchedSourceFailureAfterCoverageFreeze \
            -only-testing:VPlayerTests/AVPlayerSDKCallbackCreditPoolTests/testOperationReturnWaitCloseWakesWithoutReturningPhysicalCredit \
            -only-testing:VPlayerTests/AVPlayerSDKCallbackCreditPoolTests/testOperationReturnWaitCancelWakesWithoutReturningPhysicalCredit \
            -only-testing:VPlayerTests/AVPlayerSDKCallbackCreditPoolTests/testOperationReturnWaitRejectsSecondWaiterAndCancellationAllowsReplacement \
            -only-testing:VPlayerTests/AVPlayerSDKCallbackCreditPoolTests/testOperationReturnPhysicalDeinitRacingCancellationResolvesOnce
      - name: Report PausedReviewRegressions failures
        if: ${{ always() }}
        run: python3 Scripts/report-xcresult-failures.py "$RUNNER_TEMP/PausedReviewRegressions.xcresult"
      - name: Validate ControlPause
        if: ${{ !cancelled() && steps.debug_build.outcome == 'success' }}
        run: |
          xcodebuild test-without-building -project VPlayer.xcodeproj -scheme VPlayer \
            -destination "$TVOS_TEST_DESTINATION" CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO -collect-test-diagnostics never \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            -resultBundlePath "$RUNNER_TEMP/ControlPause.xcresult" \
            -only-testing:VPlayerTests/ControlTaskRegistryTests
      - name: Report ControlPause failures
        if: ${{ always() }}
        run: python3 Scripts/report-xcresult-failures.py "$RUNNER_TEMP/ControlPause.xcresult"
      - name: Validate RemainingPausedBoundaries
        if: ${{ !cancelled() && steps.debug_build.outcome == 'success' }}
        run: |
          xcodebuild test-without-building -project VPlayer.xcodeproj -scheme VPlayer \
            -destination "$TVOS_TEST_DESTINATION" CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO -collect-test-diagnostics never \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            -resultBundlePath "$RUNNER_TEMP/RemainingPausedBoundaries.xcresult" \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testPausedResumeBeyondStartupWindowUsesAdvancedPrefixFullLead \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testPausedResumeCommittedFinalTailUsesExactRemainingInterval \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testPausedResumeAtOrBeyondCommittedEndpointRejectsBeforeReconnect \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testPausedResumeNonfinalShortLeadRejectsBeforeReconnect \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testPausedResumeFinalTailRetirementAtEachAwaitRejectsBeforeNextEffect \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testAACEndpointReceiptRequiresSameWriterProofPlaylistHTTPBackingAndEffectiveEnd \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testAACEndpointMutationTableRejectsDeletedTrimPlusMinusOneAndPrematureNonfinalTrim \
            -only-testing:VPlayerTests/SegmentedFMP4WriterTests/testPausedPrefixResumesAuthenticatedFinalTailAfterIncrementalFinalization \
            -only-testing:VPlayerTests/SegmentedFMP4WriterTests/testCurrentFinalVideoProjectionAuthenticatesLogicalScopeAcrossRealWriterRollover
      - name: Report RemainingPausedBoundaries failures
        if: ${{ always() }}
        run: python3 Scripts/report-xcresult-failures.py "$RUNNER_TEMP/RemainingPausedBoundaries.xcresult"
      - name: Validate CursorCompatibility
        if: ${{ !cancelled() && steps.debug_build.outcome == 'success' }}
        run: |
          xcodebuild test-without-building -project VPlayer.xcodeproj -scheme VPlayer \
            -destination "$TVOS_TEST_DESTINATION" CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO -collect-test-diagnostics never \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            -resultBundlePath "$RUNNER_TEMP/CursorCompatibility.xcresult" \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testOwnedPauseCursorPriorValidBindingCannotSurviveNewUnavailableCaptureOrReplay \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testOwnedPauseCursorAcceptedResumeRetiresPredecessorAndLateStopCannotOverwriteSuccessor \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testSuccessfulTimelineIdentitySurvivesDroppedReceiptsAndOwnedPauseUntilCleanup \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testTVOS27CancelledResumeReconnectSettlesBeforeStopAndCannotPlayAgain
      - name: Report CursorCompatibility failures
        if: ${{ always() }}
        run: python3 Scripts/report-xcresult-failures.py "$RUNNER_TEMP/CursorCompatibility.xcresult"
      - name: Validate NativeExistingResume
        if: ${{ !cancelled() && steps.debug_build.outcome == 'success' }}
        run: |
          xcodebuild test-without-building -project VPlayer.xcodeproj -scheme VPlayer \
            -destination "$TVOS_TEST_DESTINATION" CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO -collect-test-diagnostics never \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            -resultBundlePath "$RUNNER_TEMP/NativeExistingResume.xcresult" \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testTVOS27NativePrepareActivateSuspendResumeSuspendPreservesItem
      - name: Report NativeExistingResume failures
        if: ${{ always() }}
        run: python3 Scripts/report-xcresult-failures.py "$RUNNER_TEMP/NativeExistingResume.xcresult"
      - name: Validate NativeProgressedResume
        if: ${{ !cancelled() && steps.debug_build.outcome == 'success' }}
        run: |
          xcodebuild test-without-building -project VPlayer.xcodeproj -scheme VPlayer \
            -destination "$TVOS_TEST_DESTINATION" CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO -collect-test-diagnostics never \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            -resultBundlePath "$RUNNER_TEMP/NativeProgressedResume.xcresult" \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testTVOS27NativeProgressedPauseResumeReusesPrepaidCallbacksAndRetiresOriginalPool
      - name: Report NativeProgressedResume failures
        if: ${{ always() }}
        run: python3 Scripts/report-xcresult-failures.py "$RUNNER_TEMP/NativeProgressedResume.xcresult"
      - name: Validate NativeLoaded
        if: ${{ !cancelled() && steps.debug_build.outcome == 'success' }}
        run: |
          xcodebuild test-without-building -project VPlayer.xcodeproj -scheme VPlayer \
            -destination "$TVOS_TEST_DESTINATION" CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO -collect-test-diagnostics never \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            -resultBundlePath "$RUNNER_TEMP/NativeLoaded.xcresult" \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testSDKFixedSystemLoopbackLoadedReceiptAndItemFailure
      - name: Report NativeLoaded failures
        if: ${{ always() }}
        run: python3 Scripts/report-xcresult-failures.py "$RUNNER_TEMP/NativeLoaded.xcresult"
      - name: Validate CanonicalOutput
        if: ${{ !cancelled() && steps.debug_build.outcome == 'success' }}
        run: |
          xcodebuild test-without-building -project VPlayer.xcodeproj -scheme VPlayer \
            -destination "$TVOS_TEST_DESTINATION" CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO -collect-test-diagnostics never \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            -resultBundlePath "$RUNNER_TEMP/CanonicalOutput.xcresult" \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testTVOS27HLSTapReportsRawOutputThroughNaturalEOSAndFinalizes
      - name: Report CanonicalOutput failures
        if: ${{ always() }}
        run: python3 Scripts/report-xcresult-failures.py "$RUNNER_TEMP/CanonicalOutput.xcresult"
      - name: Validate NativeSessionOutput
        if: ${{ !cancelled() && steps.debug_build.outcome == 'success' }}
        run: |
          xcodebuild test-without-building -project VPlayer.xcodeproj -scheme VPlayer \
            -destination "$TVOS_TEST_DESTINATION" CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO -collect-test-diagnostics never \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            -resultBundlePath "$RUNNER_TEMP/NativeSessionOutput.xcresult" \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testTVOS27HLSTapWithExplicitNativeSessionReportsRawOutput
      - name: Report NativeSessionOutput failures
        if: ${{ always() }}
        run: python3 Scripts/report-xcresult-failures.py "$RUNNER_TEMP/NativeSessionOutput.xcresult"
      - name: Validate LocalPCMOutput
        if: ${{ !cancelled() && steps.debug_build.outcome == 'success' }}
        run: |
          xcodebuild test-without-building -project VPlayer.xcodeproj -scheme VPlayer \
            -destination "$TVOS_TEST_DESTINATION" CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO -collect-test-diagnostics never \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            -resultBundlePath "$RUNNER_TEMP/LocalPCMOutput.xcresult" \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testTVOS27LocalPCMTrackTapReportsRawOutputAndFinalizes
      - name: Report LocalPCMOutput failures
        if: ${{ always() }}
        run: python3 Scripts/report-xcresult-failures.py "$RUNNER_TEMP/LocalPCMOutput.xcresult"
      - name: Validate LocalPCMMixOutput
        if: ${{ !cancelled() && steps.debug_build.outcome == 'success' }}
        run: |
          xcodebuild test-without-building -project VPlayer.xcodeproj -scheme VPlayer \
            -destination "$TVOS_TEST_DESTINATION" CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO -collect-test-diagnostics never \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            -resultBundlePath "$RUNNER_TEMP/LocalPCMMixOutput.xcresult" \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testTVOS27LocalPCMMixIDTapHasCallbackFeasibilityAndFinalizes
      - name: Report LocalPCMMixOutput failures
        if: ${{ always() }}
        run: python3 Scripts/report-xcresult-failures.py "$RUNNER_TEMP/LocalPCMMixOutput.xcresult"
      - name: Run HTTP playback and strict 900-second 4K remux assertions
        if: ${{ !cancelled() && steps.debug_build.outcome == 'success' }}
        timeout-minutes: 30
        run: |
          fixture_dir="$(mktemp -d "${RUNNER_TEMP}/vplayer-timeline.XXXXXX")"
          trap 'rm -rf "$fixture_dir"' EXIT
          python3 Scripts/generate-timeline-fixture.py "$fixture_dir/timeline.ts"
          ./Scripts/run-playback-integration-tests.sh \
            --timeline-fixture "$fixture_dir/timeline.ts" \
            --only-testing VPlayerTests/PlaybackFixtureIntegrationTests \
            --only-testing VPlayerTests/AudioRenderPipelineTests/testTask22FCAllocationAdmissionReservesBeforeNativeCopiesAndReleasesAtFreePoints \
            --only-testing VPlayerTests/AudioRenderPipelineTests/testTask22FCNativeAllocationFailureAndFailedPushCannotMasqueradeAsEOFTail \
            --only-testing VPlayerTests/HLSTimelineTests \
            -- -parallel-testing-enabled NO -collect-test-diagnostics never -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300
