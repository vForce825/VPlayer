name: macOS build and test

# Standard GitHub-hosted runners are free for this public repository.
# Do not add larger runners, artifact uploads, or persistent caches without
# reviewing their billing and storage implications.
"on":
  push:
    branches: [migration/tvos27]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Xcode 27.0 / tvOS 27.0
    runs-on: xcode-27
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      TVOS_TEST_DESTINATION: platform=tvOS Simulator,name=Apple TV 4K (3rd generation),OS=27.0
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Verify Xcode and simulator runtime
        run: |
          xcodebuild -version
          xcrun --sdk appletvsimulator --show-sdk-version
          xcrun simctl list runtimes
          xcrun simctl list devices available
          xcrun simctl list runtimes -j | jq -e '
            .runtimes[] |
            select(.identifier == "com.apple.CoreSimulator.SimRuntime.tvOS-27-0" and .isAvailable)
          '

      - name: Measure candidate SDK layouts without app host
        run: |
          cat > "$RUNNER_TEMP/layout.swift" <<'SWIFT'
          // SPDX-FileCopyrightText: 2026 VPlayer contributors
          // SPDX-License-Identifier: GPL-3.0-only
          // SPDX-FileComment: Apple App Store distribution is additionally permitted by LICENSE.APPSTORE-EXCEPTION.
          import Foundation
          
          enum Retry { case same, channel, never }
          struct Failure { let code: String; let message: String; let diagnostic: String?; let retry: Retry }
          enum PackedFailure {
              case same(code: String, message: String, diagnostic: String?)
              case channel(code: String, message: String, diagnostic: String?)
              case never(code: String, message: String, diagnostic: String?)
          }
          struct Rational { let num: Int32; let den: Int32 }
          enum Scan { case progressive, interlaced }
          enum Phase { case buffering, recovering }
          struct Info { let width: Int32; let height: Int32; let scan: Scan; let source: Rational?; let output: Double?; let enhanced: Bool }
          struct PackedInfo { let output: Double; let width: Int32; let height: Int32; let sourceNum: Int32; let sourceDen: Int32; let flags: UInt8 }
          struct PackedBoolInfo { let output: Double; let width: Int32; let height: Int32; let sourceNum: Int32; let sourceDen: Int32; let scan: Scan; let sourcePresent: Bool; let outputPresent: Bool; let enhanced: Bool }
          struct Generation { let raw: UInt64 }
          final class DiagnosticStorage { let value = 0 }
          struct Diagnostic { let storage: DiagnosticStorage }
          final class Owner { let value = 0 }
          enum FFmpegFailureKind: String { case open, read, timeout, unsupportedVideo, unsupportedAudio }
          enum FFmpegFailureStage: String { case unspecified, validation, open, streamInfo, selection, bsfInit, read, bsfSend, bsfReceive }
          enum VideoDecoderFailure { case sessionCreate(Int32), softwareDecoder, badData(Int32), malfunction(Int32), backpressureTimeout, unexpected(Diagnostic) }
          enum CoreError {
              case unsupportedProtocol(String)
              case demuxOpen(Int32)
              case demuxRead(Int32)
              case ffmpegFailure(kind: FFmpegFailureKind, stage: FFmpegFailureStage, status: Int32)
              case networkTimeout
              case unsupportedVideoCodec
              case unsupportedAudioCodec
              case videoFormatDescription(Int32)
              case hardwareDecoderUnavailable
              case videoDecoderTransitionTimeout
              case videoDecode(Int32)
              case videoDecoderFailure(VideoDecoderFailure)
              case videoSampleBuffer(String)
              case videoRendererFailed(String)
              case audioFormatDescription(Int32)
              case audioFallbackDecode(Int32)
              case audioRendererFailed(String)
              case renderTextureMapping
              case metalCommand(String)
              case cancelled
              case controlEventCapacityExceeded
              case outputActivationRejected
              case backendPublicationReplacementRejected
              case presented(Failure)
              case unexpected(stage: String, diagnostic: Diagnostic)
          }
          enum PackedCoreError {
              case unsupportedProtocol(String)
              case demuxOpen(Int32)
              case demuxRead(Int32)
              case ffmpegFailure(kind: FFmpegFailureKind, stage: FFmpegFailureStage, status: Int32)
              case networkTimeout
              case unsupportedVideoCodec
              case unsupportedAudioCodec
              case videoFormatDescription(Int32)
              case hardwareDecoderUnavailable
              case videoDecoderTransitionTimeout
              case videoDecode(Int32)
              case videoDecoderFailure(VideoDecoderFailure)
              case videoSampleBuffer(String)
              case videoRendererFailed(String)
              case audioFormatDescription(Int32)
              case audioFallbackDecode(Int32)
              case audioRendererFailed(String)
              case renderTextureMapping
              case metalCommand(String)
              case cancelled
              case controlEventCapacityExceeded
              case outputActivationRejected
              case backendPublicationReplacementRejected
              case presented(PackedFailure)
              case unexpected(stage: String, diagnostic: Diagnostic)
          }
          enum OtherCoreError {
              case unsupportedProtocol(String)
              case demuxOpen(Int32)
              case demuxRead(Int32)
              case ffmpegFailure(kind: FFmpegFailureKind, stage: FFmpegFailureStage, status: Int32)
              case networkTimeout
              case unsupportedVideoCodec
              case unsupportedAudioCodec
              case videoFormatDescription(Int32)
              case hardwareDecoderUnavailable
              case videoDecoderTransitionTimeout
              case videoDecode(Int32)
              case videoDecoderFailure(VideoDecoderFailure)
              case videoSampleBuffer(String)
              case videoRendererFailed(String)
              case audioFormatDescription(Int32)
              case audioFallbackDecode(Int32)
              case audioRendererFailed(String)
              case renderTextureMapping
              case metalCommand(String)
              case cancelled
              case controlEventCapacityExceeded
              case outputActivationRejected
              case backendPublicationReplacementRejected
              case unexpected(stage: String, diagnostic: Diagnostic)
          }
          enum Event { case ready(UInt64), phase(Phase, UInt64), media(Info?, Generation?), stopped, failed(CoreError), backend(Diagnostic, UInt64, Owner) }
          enum PackedFailureEvent { case ready(UInt64), phase(Phase, UInt64), media(Info?, Generation?), stopped, failed(PackedCoreError), backend(Diagnostic, UInt64, Owner) }
          enum PackedMediaEvent { case ready(UInt64), phase(Phase, UInt64), media(PackedInfo?, Generation?), stopped, failed(CoreError), backend(Diagnostic, UInt64, Owner) }
          enum PackedBoolMediaEvent { case ready(UInt64), phase(Phase, UInt64), media(PackedBoolInfo?, Generation?), stopped, failed(CoreError), backend(Diagnostic, UInt64, Owner) }
          enum PackedEvent { case ready(UInt64), phase(Phase, UInt64), media(PackedInfo?, Generation?), stopped, failed(PackedCoreError), backend(Diagnostic, UInt64, Owner) }
          enum PackedBoolEvent { case ready(UInt64), phase(Phase, UInt64), media(PackedBoolInfo?, Generation?), stopped, failed(PackedCoreError), backend(Diagnostic, UInt64, Owner) }
          enum FlattenedEvent {
              case ready(UInt64), phase(Phase, UInt64), media(PackedBoolInfo?, Generation?), stopped
              case otherFailure(OtherCoreError)
              case presentedSame(String, String, String?)
              case presentedChannel(String, String, String?)
              case presentedNever(String, String, String?)
              case backend(Diagnostic, UInt64, Owner)
          }
          // Only payload geometry for a possible separately charged fixed-tag fallback.
          // All presence/enum tags would need explicit side storage; these are not standalone events.
          typealias SplitStringPayload = (String, String, String?)
          struct SplitMediaPayload { let generation: UInt64; let output: Double; let width: Int32; let height: Int32; let sourceNum: Int32; let sourceDen: Int32 }
          typealias SplitBackendPayload = (Diagnostic, UInt64, Owner)
          @_cdecl("layoutFailure") public func layoutFailure() -> Int { MemoryLayout<Failure>.stride }
          @_cdecl("layoutPackedFailure") public func layoutPackedFailure() -> Int { MemoryLayout<PackedFailure>.stride }
          @_cdecl("layoutInfo") public func layoutInfo() -> Int { MemoryLayout<Info>.stride }
          @_cdecl("layoutPackedInfo") public func layoutPackedInfo() -> Int { MemoryLayout<PackedInfo>.stride }
          @_cdecl("layoutPackedBoolInfo") public func layoutPackedBoolInfo() -> Int { MemoryLayout<PackedBoolInfo>.stride }
          @_cdecl("layoutCoreError") public func layoutCoreError() -> Int { MemoryLayout<CoreError>.stride }
          @_cdecl("layoutPackedCoreError") public func layoutPackedCoreError() -> Int { MemoryLayout<PackedCoreError>.stride }
          @_cdecl("layoutOtherCoreError") public func layoutOtherCoreError() -> Int { MemoryLayout<OtherCoreError>.stride }
          @_cdecl("layoutEvent") public func layoutEvent() -> Int { MemoryLayout<Event>.stride }
          @_cdecl("layoutPackedFailureEvent") public func layoutPackedFailureEvent() -> Int { MemoryLayout<PackedFailureEvent>.stride }
          @_cdecl("layoutPackedMediaEvent") public func layoutPackedMediaEvent() -> Int { MemoryLayout<PackedMediaEvent>.stride }
          @_cdecl("layoutPackedBoolMediaEvent") public func layoutPackedBoolMediaEvent() -> Int { MemoryLayout<PackedBoolMediaEvent>.stride }
          @_cdecl("layoutPackedEvent") public func layoutPackedEvent() -> Int { MemoryLayout<PackedEvent>.stride }
          @_cdecl("layoutPackedBoolEvent") public func layoutPackedBoolEvent() -> Int { MemoryLayout<PackedBoolEvent>.stride }
          @_cdecl("layoutFlattenedEvent") public func layoutFlattenedEvent() -> Int { MemoryLayout<FlattenedEvent>.stride }
          @_cdecl("layoutSplitStringPayload") public func layoutSplitStringPayload() -> Int { MemoryLayout<SplitStringPayload>.stride }
          @_cdecl("layoutSplitMediaPayload") public func layoutSplitMediaPayload() -> Int { MemoryLayout<SplitMediaPayload>.stride }
          @_cdecl("layoutSplitBackendPayload") public func layoutSplitBackendPayload() -> Int { MemoryLayout<SplitBackendPayload>.stride }
          @_cdecl("optionalInfo") public func optionalInfo() -> Int { MemoryLayout<Info?>.stride }
          @_cdecl("sizeInfo") public func sizeInfo() -> Int { MemoryLayout<Info>.size }
          @_cdecl("optionalPackedInfo") public func optionalPackedInfo() -> Int { MemoryLayout<PackedInfo?>.stride }
          @_cdecl("sizePackedInfo") public func sizePackedInfo() -> Int { MemoryLayout<PackedInfo>.size }
          @_cdecl("optionalPackedBoolInfo") public func optionalPackedBoolInfo() -> Int { MemoryLayout<PackedBoolInfo?>.stride }
          @_cdecl("sizePackedBoolInfo") public func sizePackedBoolInfo() -> Int { MemoryLayout<PackedBoolInfo>.size }
          @_cdecl("alignmentEvent") public func alignmentEvent() -> Int { MemoryLayout<Event>.alignment }
          @_cdecl("alignmentFlattenedEvent") public func alignmentFlattenedEvent() -> Int { MemoryLayout<FlattenedEvent>.alignment }
          @_cdecl("alignmentSplitStringPayload") public func alignmentSplitStringPayload() -> Int { MemoryLayout<SplitStringPayload>.alignment }
          @_cdecl("alignmentSplitMediaPayload") public func alignmentSplitMediaPayload() -> Int { MemoryLayout<SplitMediaPayload>.alignment }
          SWIFT
          xcrun swiftc -O -emit-ir -target arm64-apple-tvos27.0-simulator -sdk "$(xcrun --sdk appletvsimulator --show-sdk-path)" "$RUNNER_TEMP/layout.swift" -o "$RUNNER_TEMP/layout.ll"
          python3 - "$RUNNER_TEMP/layout.ll" <<'PY'
          import re,sys
          text=open(sys.argv[1]).read()
          found=0
          for name,body in re.findall(r'define[^\n]*@((?:layout|optional|size|alignment)[A-Za-z]+)\([^)]*\)[^{]*\{(.*?)\n\}',text,re.S):
              value=re.search(r'ret i64 (\d+)',body)
              if value:
                  print("SDK_LAYOUT " + name + "=" + value.group(1))
                  found+=1
          if found != 28:
              raise SystemExit("expected28 named scalar layouts, got "+str(found))
          PY
          
      - name: Measure simulator allocator bins without app host
        if: ${{ !cancelled() }}
        run: |
          cat > "$RUNNER_TEMP/bins.c" <<'C'
          #include <malloc/malloc.h>
          #include <stdio.h>
          #include <stdlib.h>
          int main(void) {
            size_t sizes[]={32,48,64,80,96,112,128,224,256,448,512,672,768,784,896,1024,1152,1280,1408,1536,1664,1792,1824};
            for(unsigned i=0;i<sizeof(sizes)/sizeof(sizes[0]);i++) {
              void *p=malloc(sizes[i]); if(!p) return 2;
              printf("SDK_ALLOC request=%zu good=%zu actual=%zu\n",sizes[i],malloc_good_size(sizes[i]),malloc_size(p));
              free(p);
            }
            return 0;
          }
          C
          xcrun --sdk appletvsimulator clang -target arm64-apple-tvos27.0-simulator -isysroot "$(xcrun --sdk appletvsimulator --show-sdk-path)" "$RUNNER_TEMP/bins.c" -o "$RUNNER_TEMP/bins"
          python3 - <<'PY'
          import json,subprocess,os
          r=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))
          devices=r['devices']['com.apple.CoreSimulator.SimRuntime.tvOS-27-0']
          d=next(x for x in devices if x['name']=='Apple TV 4K (3rd generation)')
          if d['state']!='Booted': subprocess.run(['xcrun','simctl','boot',d['udid']],check=True,timeout=60)
          subprocess.run(['xcrun','simctl','bootstatus',d['udid'],'-b'],check=True,timeout=180)
          subprocess.run(['xcrun','simctl','spawn',d['udid'],os.environ['RUNNER_TEMP']+'/bins'],check=True,timeout=30)
          PY
          
