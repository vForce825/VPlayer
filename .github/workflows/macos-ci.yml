name: Native fixture and interruption validation

# Standard GitHub-hosted runners are free for this public repository.
# Do not add larger runners, artifact uploads, or persistent caches without
# reviewing their billing and storage implications.
"on":
  push:
    branches: [migration/tvos27]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-ci-native-diagnostics-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Xcode 27.0 / tvOS 27.0
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      TVOS_TEST_DESTINATION: platform=tvOS Simulator,name=Apple TV 4K (3rd generation),OS=27.0
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Verify Xcode and simulator runtime
        run: |
          xcodebuild -version
          xcrun --sdk appletvsimulator --show-sdk-version
          xcrun simctl list runtimes
          xcrun simctl list devices available
          xcrun simctl list runtimes -j | jq -e '
            .runtimes[] |
            select(.identifier == "com.apple.CoreSimulator.SimRuntime.tvOS-27-0" and .isAvailable)
          '

      - name: Install build tooling
        run: brew install mint jq ripgrep

      - name: Build and audit pinned FFmpeg
        run: ./ci_scripts/ci_post_clone.sh

      - name: Install Apple Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Check deployment floors and precompiled Metal reproducibility
        id: debug_preflight
        run: |
          python3 Scripts/Tests/test_tvos27_deployment.py
          ./Scripts/Tests/test_precompiled_metal_library.sh

      - name: Generate the project for the new test-only output probe
        id: generated_project
        run: |
          ./Scripts/bootstrap.sh --generate
          ./Scripts/verify-licenses.sh
      - name: Export the generated project for reproducible commit
        if: ${{ !cancelled() && steps.generated_project.outcome == 'success' }}
        run: |
          python3 - <<'PYPROJECT'
          import base64, hashlib, pathlib
          data = pathlib.Path("VPlayer.xcodeproj/project.pbxproj").read_bytes()
          encoded = base64.b64encode(data).decode("ascii")
          print("CI_GENERATED_PROJECT_BEGIN sha256=" + hashlib.sha256(data).hexdigest())
          for offset in range(0, len(encoded), 4096):
              print("CI_GENERATED_PROJECT_CHUNK=" + encoded[offset:offset + 4096])
          print("CI_GENERATED_PROJECT_END")
          PYPROJECT
      - name: Compile complete Debug targets with the output probe
        id: debug_build
        run: |
          ./Scripts/bootstrap.sh --check
          xcodebuild build-for-testing -project VPlayer.xcodeproj -scheme VPlayer \
            -destination "$TVOS_TEST_DESTINATION" CODE_SIGNING_ALLOWED=NO
      - name: Validate TypedInterruption
        if: ${{ !cancelled() && steps.debug_build.outcome == 'success' }}
        run: |
          xcodebuild test-without-building -project VPlayer.xcodeproj -scheme VPlayer \
            -destination "$TVOS_TEST_DESTINATION" CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO -collect-test-diagnostics never \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            -resultBundlePath "$RUNNER_TEMP/TypedInterruption.xcresult" \
            -only-testing:VPlayerTests/SystemAudioSessionConfiguratorTests \
            -only-testing:VPlayerTests/PlaybackControllerTests/testLateTypedInterruptionCannotAutomaticallyReactivateManualResumeVeto
      - name: Report TypedInterruption failures
        if: ${{ always() }}
        run: python3 Scripts/report-xcresult-failures.py "$RUNNER_TEMP/TypedInterruption.xcresult"
      - name: Validate CoordinatorFixtures
        if: ${{ !cancelled() && steps.debug_build.outcome == 'success' }}
        run: |
          xcodebuild test-without-building -project VPlayer.xcodeproj -scheme VPlayer \
            -destination "$TVOS_TEST_DESTINATION" CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO -collect-test-diagnostics never \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            -resultBundlePath "$RUNNER_TEMP/CoordinatorFixtures.xcresult" \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testSDKFixedStopReplaysExactFailureAndMeasuresObjects \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testStorageStopReadsDirectlyAndLatePausedRelayCannotRepairFailedReceipt \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testTVOS27DisconnectCallbackWithoutDisconnectedStateCannotSignReceipt \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testTVOS27ReconnectDuringDirectPauseReadCannotSignReceipt \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testStopRequiresRegistrySuspendClaimAndDoesNotJoinDifferentParameters \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testStorageReadinessChecksOriginalURLGenerationAndSequenceAtBindAndRevalidation \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testSeekUsesTrackTimescaleAndLoadedRangesWaitMergeToContinuousThreeSeconds \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testTVOS27FailedPreparationRetainsInstalledOwnerUntilPhysicalRetirement \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testOwnedPauseCursorFailedOriginalStopCannotPublishOrRetryItsCapturedTime \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testReview3BackendQuiescenceReceiptRequiresExactPrivateIssuerIdentityAndSingleConsumption
      - name: Report CoordinatorFixtures failures
        if: ${{ always() }}
        run: python3 Scripts/report-xcresult-failures.py "$RUNNER_TEMP/CoordinatorFixtures.xcresult"
      - name: Validate AudioOutputProbe
        if: ${{ !cancelled() && steps.debug_build.outcome == 'success' }}
        run: |
          xcodebuild test-without-building -project VPlayer.xcodeproj -scheme VPlayer \
            -destination "$TVOS_TEST_DESTINATION" CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO -collect-test-diagnostics never \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            -resultBundlePath "$RUNNER_TEMP/AudioOutputProbe.xcresult" \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testTVOS27HLSTapReportsRawOutputThroughNaturalEOSAndFinalizes
      - name: Report AudioOutputProbe failures
        if: ${{ always() }}
        run: python3 Scripts/report-xcresult-failures.py "$RUNNER_TEMP/AudioOutputProbe.xcresult"
      - name: Validate NativeLoaded
        if: ${{ !cancelled() && steps.debug_build.outcome == 'success' }}
        run: |
          xcodebuild test-without-building -project VPlayer.xcodeproj -scheme VPlayer \
            -destination "$TVOS_TEST_DESTINATION" CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO -collect-test-diagnostics never \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            -resultBundlePath "$RUNNER_TEMP/NativeLoaded.xcresult" \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testSDKFixedSystemLoopbackLoadedReceiptAndItemFailure
      - name: Report NativeLoaded failures
        if: ${{ always() }}
        run: python3 Scripts/report-xcresult-failures.py "$RUNNER_TEMP/NativeLoaded.xcresult"
      - name: Validate NativeEOS
        if: ${{ !cancelled() && steps.debug_build.outcome == 'success' }}
        run: |
          xcodebuild test-without-building -project VPlayer.xcodeproj -scheme VPlayer \
            -destination "$TVOS_TEST_DESTINATION" CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO -collect-test-diagnostics never \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            -resultBundlePath "$RUNNER_TEMP/NativeEOS.xcresult" \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testFinalEOSRequiresTwoStableDirectReadsAndRetiresOnTrimMutationTimeoutOrEndpointMismatch
      - name: Report NativeEOS failures
        if: ${{ always() }}
        run: python3 Scripts/report-xcresult-failures.py "$RUNNER_TEMP/NativeEOS.xcresult"
      - name: Validate NativeCoalesced
        if: ${{ !cancelled() && steps.debug_build.outcome == 'success' }}
        run: |
          xcodebuild test-without-building -project VPlayer.xcodeproj -scheme VPlayer \
            -destination "$TVOS_TEST_DESTINATION" CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO -collect-test-diagnostics never \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            -resultBundlePath "$RUNNER_TEMP/NativeCoalesced.xcresult" \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testNativeEndpointFirstReadSurvivesCoalescedPausedRelayAndRejectsChangedSecondRead \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testNativeEndpointFirstReadSurvivesLaterPausedRelayAndRejectsChangedSecondRead
      - name: Report NativeCoalesced failures
        if: ${{ always() }}
        run: python3 Scripts/report-xcresult-failures.py "$RUNNER_TEMP/NativeCoalesced.xcresult"
