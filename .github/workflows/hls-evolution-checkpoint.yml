name: HLS evolution focused checkpoint

# Integration-only development evidence; the six same-head PR gates are unchanged.
"on":
  push:
    branches: [feat/homepod-hls-evolution]

permissions:
  contents: read

concurrency:
  group: hls-evolution-checkpoint-${{ github.sha }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
  TVOS_TEST_DESTINATION: platform=tvOS Simulator,name=Apple TV 4K (3rd generation),OS=27.0
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_ANALYTICS: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lifecycle-checkpoint:
    runs-on: xcode-27
    timeout-minutes: 70
    steps:
      - name: Check out the exact integration head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify source, Xcode and tvOS SDK
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "CHECKPOINT_HEAD=$GITHUB_SHA"
          echo "CHECKPOINT_TREE=$(git rev-parse HEAD^{tree})"
          xcodebuild -version
          test "$(xcodebuild -version | head -n 1)" = "Xcode 27.0"
          test "$(xcrun --sdk appletvsimulator --show-sdk-version)" = "27.0"
      - name: Prepare pinned dependencies and synthetic AAC resource
        id: prepare
        timeout-minutes: 40
        run: |
          brew install mint jq ripgrep ffmpeg
          xcrun simctl list runtimes -j | jq -e '
            .runtimes[] |
            select(.identifier == "com.apple.CoreSimulator.SimRuntime.tvOS-27-0" and .isAvailable)
          '
          ./ci_scripts/ci_post_clone.sh
          xcodebuild -downloadComponent MetalToolchain
          ./Scripts/bootstrap.sh --check
          ./Scripts/verify-licenses.sh
          python3 Scripts/generate-homepod-audio-diagnostic-fixture.py --output Tests/Fixtures/Video/synthetic-hlg50-ac3-64s.ts
          test -s Tests/Fixtures/Video/synthetic-hlg50-ac3-64s.ts
          shasum -a 256 Tests/Fixtures/Video/synthetic-hlg50-ac3-64s.ts
      - name: Run focused lifecycle and original media regressions
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        timeout-minutes: 25
        run: |
          # 300 seconds bounds each playback test, not the build or entire suite.
          # No artifact upload, persistent cache or private source media.
          ./Scripts/test.sh -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/HLSEvolutionCheckpoint" \
            -resultBundlePath "$RUNNER_TEMP/HLSEvolutionCheckpoint.xcresult" \
            -parallel-testing-enabled NO -collect-test-diagnostics never \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            -only-testing:VPlayerTests/LoopbackHTTPServerTests/testFinalAdvertisedAlternativeAccessLogRunsExactlyOneRegistryReplacement \
            -only-testing:VPlayerTests/LoopbackHTTPServerTests/testFinalRealSocketSelectionChangeReconcilesPrepareAuthorizedAndActivatedLifecycles \
            -only-testing:VPlayerTests/HLSPublisherTests/testLiveGateFollowsVaryingRealSegmentDurationsAcrossOneBurst \
            -only-testing:VPlayerTests/BackendOwnershipTests/testPauseDuringRouteHandoffPreservesPausedStateForSuccessor \
            -only-testing:VPlayerTests/HLSAVPlayerBackendTests/testProductionCapacitySelectedWakeStaysRevokedAcrossGenuineEOFHandoff \
            -only-testing:VPlayerTests/HLSAVPlayerBackendTests/testProductionHLSAutomaticReplacementInvalidatesMediaBeforeRetirement \
            -only-testing:VPlayerTests/HLSAVPlayerBackendTests/testProductionHLSPrepareWhilePausedPublishesButCanceledPrepareDoesNot \
            -only-testing:VPlayerTests/HLSAVPlayerBackendTests/testProductionHLSRouteHandoffClearsMediaAndRejectsOldCallbacksAfterSampleBuffer \
            -only-testing:VPlayerTests/LoopbackHTTPServerTests/testReview2SuccessfulSendTerminalIngressInvalidatesActiveAuthorityAndEmitsOneReprepare \
            -only-testing:VPlayerTests/LoopbackHTTPServerTests/testReview3ConflictingRenditionTerminalAutomaticallyRunsOneRegistryStopAndReprepare \
            -only-testing:VPlayerTests/HLSAVPlayerBackendTests/testSelectedLiveWakeCannotFailACompletedGenuineNaturalEOF \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testTVOS27NativePrepareActivateSuspendResumeSuspendPreservesItem \
            -only-testing:VPlayerTests/LoopbackHTTPServerTests/testTwoFourParticipantLineagesAndFourteenSelectionsKeepExactStorageRoots \
            -only-testing:VPlayerTests/HLSAVPlayerBackendTests/testProductionAirPlayPublishesMediaInformationThroughControllerToPresentation \
            -only-testing:VPlayerTests/HLSAVPlayerBackendTests/testLiveInjectedClockRetiresTheBackpressuredProducerAndRejectsLateWake \
            -only-testing:VPlayerTests/HLSAVPlayerBackendTests/testLiveInjectedClockSourceSilenceFailsAtTheOriginalPublicationDeadline \
            -only-testing:VPlayerTests/HLSAVPlayerBackendTests/testLiveLongGOPBurstContinuesBeyondSixtyFiveSecondsWithoutEOF \
            -only-testing:VPlayerTests/HLSAVPlayerBackendTests/testLiveLongGOPPendingSegmentPublishesWithoutAnotherCallback \
            -only-testing:VPlayerTests/HLSAVPlayerBackendTests/testLivePublicationCommitUsesTheLoopbackMonotonicTimeDomain \
            -only-testing:VPlayerTests/HLSAVPlayerBackendTests/testSyntheticHLG50AC3OriginalAACFragmentsDecodeContinuously \
            -only-testing:VPlayerTests/HLSAVPlayerBackendTests/testSyntheticAACSilenceMeterDetectsOffsetTwentyOneMillisecondMute \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testCanceledHeldPrefixCannotInstallAndJoinsProducerRetirement \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testQueuedStatusAfterOwnedPauseRevocationCannotInvalidateResumableItem \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testObservedStallsReprepareRealHLSBackendAndExhaustRequestBudget \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testOriginalQueuedProgressDeliveryCannotAdoptActualRouteReplacement \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testInitiallyInvalidCurrentItemClockKeepsPollingUntilProgressThenStall \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testInvalidCurrentItemClockAfterProgressTriggersOnceWithoutTimerSpin \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testForeignPhysicalItemCancelsProgressWithoutAdoptingReplacementClock \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testRegistryDeadlineDetectsWaitingOnlyAfterActualMediaClockAdvance \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testQueuedProgressDeadlineCannotRecoverCanceledActivation \
            -only-testing:VPlayerTests/AVPlayerItemCoordinatorTests/testPendingNaturalEndCancelsProgressPollingWithoutReplacement \
            -only-testing:VPlayerTests/PlaybackControllerTests/testHLSWatchdogRecoveryBudgetSurvivesFreshPrepareAndActivation \
            -only-testing:VPlayerTests/PlaybackControllerTests/testRepeatedHLSRouteReplacementReclaimsDestroyedRelayChildren \
            -only-testing:VPlayerTests/PlaybackControllerTests/testHLSWatchdogRecoveryRetainsCurrentRelayAndRejectsOldPrepareFailure \
            -only-testing:VPlayerTests/PlaybackControllerTests/testHLSAutomaticReplacementAuthorityWithRealRelayRepreparesAndReactivates \
            -only-testing:VPlayerTests/BackendOwnershipTests/testRunningPrepareValidationFoldsSafetyIngressBeforeInstallation \
            -only-testing:VPlayerTests/PlaybackControllerTests/testPublicationReplacementRetiresExactlyOnceWhenSuspendRequiresRetirement \
            -only-testing:VPlayerTests/HLSAVPlayerBackendTests/testLatePublicationFixtureHasFifteenSecondEligibleTimeline \
            -only-testing:VPlayerTests/BackendDiagnosticsTests
      - name: Report bounded exact-head failures
        if: ${{ always() }}
        timeout-minutes: 3
        run: |
          echo "CHECKPOINT_RESULT_HEAD=$(git rev-parse HEAD)"
          python3 Scripts/report-xcresult-failures.py "$RUNNER_TEMP/HLSEvolutionCheckpoint.xcresult"
