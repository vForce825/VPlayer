name: HLS preparation only, pinned Apple project readback

# Temporary preparation checkpoint, removed after genuine readback before final PR.
# It never substitutes for acceptance or the six complete gates.
"on":
  push:
    branches: [work/homepod-hls-rebuild]
    paths:
      - .github/workflows/hls-project-generation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hls-project-generation-${{ github.sha }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
  HOMEBREW_NO_AUTO_UPDATE: '1'
  HOMEBREW_NO_ANALYTICS: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  preparation-only:
    runs-on: xcode-27
    timeout-minutes: 55
    steps:
      - name: Check out immutable preparation commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Generate public resources then authentic pinned XcodeGen output
        timeout-minutes: 50
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          xcode_version="$(xcodebuild -version)"
          test "${xcode_version%%$'\n'*}" = 'Xcode 27.0'
          test "$(xcrun --sdk appletvsimulator --show-sdk-version)" = '27.0'
          brew install mint jq ripgrep pkgconf x264 x265 nasm
          tool_env="$(./Scripts/provision-hls-fixture-toolchain.sh)"
          source "$tool_env"
          ./Scripts/verify-hls-fixture-toolchain.sh
          ./ci_scripts/ci_post_clone.sh
          xcodebuild -downloadComponent MetalToolchain
          ./Scripts/prepare-hls-ci-fixtures.sh --project-readback
          ./Scripts/bootstrap.sh --generate
          python3 Scripts/Support/bind-hls-acceptance-testplan.py
          ./Scripts/bootstrap.sh --check
          ./Scripts/verify-licenses.sh
          xcodebuild -list -json -project VPlayer.xcodeproj
          python3 Scripts/Support/export-hls-generation.py
