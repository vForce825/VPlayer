name: VPlayer
options:
  bundleIdPrefix: com.vplayer
  deploymentTarget:
    tvOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: true
    ENABLE_USER_SCRIPT_SANDBOXING: true
    CLANG_ENABLE_MODULES: true
targets:
  VPlayerCore:
    type: framework
    platform: tvOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources/VPlayerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vplayer.core
        DEFINES_MODULE: true
        GENERATE_INFOPLIST_FILE: true
  VPlayerPlayback:
    type: framework
    platform: tvOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources/VPlayerPlayback
        excludes:
          - include
      - path: Sources/VPlayerPlayback/include
        headerVisibility: public
    dependencies:
      - target: VPlayerCore
      - framework: Vendor/FFmpeg/Artifacts/FFmpeg.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: CoreFoundation.framework
      - sdk: VideoToolbox.framework
      - sdk: CoreMedia.framework
      - sdk: CryptoKit.framework
      - sdk: CoreVideo.framework
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: AVKit.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vplayer.playback
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: true
        CLANG_C_LANGUAGE_STANDARD: c11
        GCC_TREAT_WARNINGS_AS_ERRORS: YES
        PUBLIC_HEADERS_FOLDER_PATH: "$(CONTENTS_FOLDER_PATH)/Headers"
        OTHER_LDFLAGS: "$(inherited) -lz"
  VPlayer:
    type: application
    platform: tvOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources/VPlayerApp
        excludes:
          - Resources/Info.plist
    dependencies:
      - target: VPlayerCore
      - target: VPlayerPlayback
      - sdk: CryptoKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vplayer.app
        PRODUCT_NAME: VPlayer
        INFOPLIST_FILE: Sources/VPlayerApp/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        CODE_SIGN_STYLE: Automatic
  VPlayerTests:
    type: bundle.unit-test
    platform: tvOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests/VPlayerTests
      - path: Tests/Fixtures/playlists
        type: folder
        buildPhase: resources
      - path: Tests/Fixtures/epg
        type: folder
        buildPhase: resources
      - path: Tests/Fixtures/Video
        type: folder
        buildPhase: resources
    dependencies:
      - target: VPlayerCore
      - target: VPlayerPlayback
      - target: VPlayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vplayer.tests
        GENERATE_INFOPLIST_FILE: true
  VPlayerUITests:
    type: bundle.ui-testing
    platform: tvOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests/VPlayerUITests
        excludes:
          - Info.plist
    dependencies:
      - target: VPlayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vplayer.uitests
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Tests/VPlayerUITests/Info.plist
        TEST_TARGET_NAME: VPlayer
schemes:
  VPlayer:
    build:
      targets:
        VPlayerCore: all
        VPlayerPlayback: all
        VPlayer: all
        VPlayerTests: [test]
        VPlayerUITests: [test]
    test:
      gatherCoverageData: true
      targets:
        - name: VPlayerTests
          parallelizable: true
        - name: VPlayerUITests
          parallelizable: false
    run:
      config: Debug
    archive:
      config: Release
