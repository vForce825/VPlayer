name: VPlayer
options:
  bundleIdPrefix: com.vplayer
  deploymentTarget:
    tvOS: "27.0"
    iOS: "27.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: true
    ENABLE_USER_SCRIPT_SANDBOXING: true
    CLANG_ENABLE_MODULES: true
targets:
  VPlayerCore:
    type: framework
    platform: tvOS
    deploymentTarget: "27.0"
    sources:
      - path: Sources/VPlayerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vplayer.core
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "1"
        DEFINES_MODULE: true
        GENERATE_INFOPLIST_FILE: true
  VPlayerPlayback:
    type: framework
    platform: tvOS
    deploymentTarget: "27.0"
    sources:
      - path: Sources/VPlayerPlayback
        excludes:
          - include
          - Resources
          - Deinterlace/YADIF/YADIF.metal
          - Scan/ScanProbe.metal
      - path: Sources/VPlayerPlayback/include
        headerVisibility: public
      - path: Sources/VPlayerPlayback/Resources
        buildPhase: resources
        excludes:
          - VPlayerPlayback-ios.metallib
          - VPlayerPlayback-iphonesimulator.metallib
    dependencies:
      - target: VPlayerCore
      - framework: Vendor/FFmpeg/Artifacts/FFmpeg.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: CoreFoundation.framework
      - sdk: VideoToolbox.framework
      - sdk: CoreMedia.framework
      - sdk: CryptoKit.framework
      - sdk: CoreVideo.framework
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: AVKit.framework
      - sdk: Network.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vplayer.playback
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "1"
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: true
        CLANG_C_LANGUAGE_STANDARD: c11
        GCC_TREAT_WARNINGS_AS_ERRORS: YES
        PUBLIC_HEADERS_FOLDER_PATH: "$(CONTENTS_FOLDER_PATH)/Headers"
        OTHER_LDFLAGS: "$(inherited) -lz"
  VPlayer:
    type: application
    platform: tvOS
    deploymentTarget: "27.0"
    sources:
      - path: Sources/VPlayerApp
        excludes:
          - Resources/Info.plist
    dependencies:
      - target: VPlayerCore
      - target: VPlayerPlayback
      - sdk: CryptoKit.framework
      - sdk: NowPlaying.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vforce.vplayer
        PRODUCT_NAME: VPlayer
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Sources/VPlayerApp/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        CODE_SIGN_STYLE: Automatic
  VPlayerTests:
    type: bundle.unit-test
    platform: tvOS
    deploymentTarget: "27.0"
    sources:
      - path: Tests/VPlayerTests
      - path: Tests/Fixtures/playlists
        type: folder
        buildPhase: resources
      - path: Tests/Fixtures/epg
        type: folder
        buildPhase: resources
      - path: Tests/Fixtures/Video
        type: folder
        buildPhase: resources
      - path: Tests/Fixtures/SourcePlanning
        type: folder
        buildPhase: resources
      - path: Tests/Fixtures/Images
        type: folder
        buildPhase: resources
      - path: Tests/VPlayerTests/Fixtures/Media/eac3-main-6x1block-5.1.eac3
        buildPhase: resources
      - path: Tests/VPlayerTests/Fixtures/Media/supported-audio-coverage.json
        buildPhase: resources
    dependencies:
      - target: VPlayerCore
      - target: VPlayerPlayback
      - target: VPlayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vplayer.tests
        GENERATE_INFOPLIST_FILE: true
  VPlayerReleaseBoundaryTests:
    type: bundle.unit-test
    platform: tvOS
    deploymentTarget: "27.0"
    sources:
      - path: Tests/VPlayerReleaseBoundaryTests
    dependencies:
      - target: VPlayerCore
      - target: VPlayerPlayback
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vplayer.release-boundary-tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: ""
        BUNDLE_LOADER: ""
  VPlayerHLSAcceptanceTests:
    type: bundle.unit-test
    platform: tvOS
    deploymentTarget: "27.0"
    sources:
      - path: Tests/VPlayerHLSAcceptanceTests
      - path: Tests/Fixtures/HLSAcceptance
        type: folder
        buildPhase: resources
    dependencies:
      - target: VPlayerCore
      - target: VPlayerPlayback
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vplayer.hls-acceptance-tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: ""
        BUNDLE_LOADER: ""
  VPlayerUITests:
    type: bundle.ui-testing
    platform: tvOS
    deploymentTarget: "27.0"
    sources:
      - path: Tests/VPlayerUITests
        excludes:
          - Info.plist
    dependencies:
      - target: VPlayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vplayer.uitests
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Tests/VPlayerUITests/Info.plist
        TEST_TARGET_NAME: VPlayer
  VPlayerCoreiOS:
    productName: VPlayerCore
    type: framework
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: Sources/VPlayerCore
    settings:
      base:
        PRODUCT_NAME: VPlayerCore
        PRODUCT_MODULE_NAME: VPlayerCore
        PRODUCT_BUNDLE_IDENTIFIER: com.vplayer.core.ios
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "1"
        DEFINES_MODULE: true
        GENERATE_INFOPLIST_FILE: true
  VPlayerPlaybackiOS:
    productName: VPlayerPlayback
    type: framework
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: Sources/VPlayerPlayback
        excludes:
          - include
          - Resources
          - Deinterlace/YADIF/YADIF.metal
          - Scan/ScanProbe.metal
      - path: Sources/VPlayerPlayback/include
        headerVisibility: public
      - path: Sources/VPlayerPlayback/Resources
        buildPhase: resources
        excludes:
          - VPlayerPlayback-tvos.metallib
          - VPlayerPlayback-tvsimulator.metallib
    dependencies:
      - target: VPlayerCoreiOS
      - framework: Vendor/FFmpeg/Artifacts-iOS/FFmpeg.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: CoreFoundation.framework
      - sdk: VideoToolbox.framework
      - sdk: CoreMedia.framework
      - sdk: CryptoKit.framework
      - sdk: CoreVideo.framework
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: AVKit.framework
      - sdk: Network.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
    settings:
      base:
        PRODUCT_NAME: VPlayerPlayback
        PRODUCT_MODULE_NAME: VPlayerPlayback
        PRODUCT_BUNDLE_IDENTIFIER: com.vplayer.playback.ios
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "1"
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: true
        CLANG_C_LANGUAGE_STANDARD: c11
        GCC_TREAT_WARNINGS_AS_ERRORS: YES
        PUBLIC_HEADERS_FOLDER_PATH: "$(CONTENTS_FOLDER_PATH)/Headers"
        OTHER_LDFLAGS: "$(inherited) -lz"
  VPlayeriOS:
    productName: VPlayer
    type: application
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: Sources/VPlayeriOSApp
        excludes:
          - Resources/Info.plist
      - path: Sources/VPlayerApp/AppDependencies.swift
      - path: Sources/VPlayerApp/AppLaunchConfiguration.swift
      - path: Sources/VPlayerApp/AppModel.swift
      - path: Sources/VPlayerApp/ChannelLogoDataLoader.swift
      - path: Sources/VPlayerApp/ChannelLogoDiskCache.swift
      - path: Sources/VPlayerApp/ChannelLogoImageDecoder.swift
      - path: Sources/VPlayerApp/LibraryChangeSignal.swift
      - path: Sources/VPlayerApp/Lifecycle
      - path: Sources/VPlayerApp/Player/AcceptancePlaybackStatePresentation.swift
      - path: Sources/VPlayerApp/Player/FullScreenPlayerViewModel.swift
      - path: Sources/VPlayerApp/Player/PlaybackMediaInformationPresentation.swift
      - path: Sources/VPlayerApp/Player/PlaybackNowPlayingCoordinator.swift
      - path: Sources/VPlayerApp/Player/PlaybackPresentationHost.swift
      - path: Sources/VPlayerApp/Player/PlayerChannelPresentation.swift
      - path: Sources/VPlayerApp/Player/PlayerPresentationPolicies.swift
      - path: Sources/VPlayerApp/Player/UITestPlaybackEngine.swift
      - path: Sources/VPlayerApp/Settings/ChannelBrowsingSettingsStore.swift
      - path: Sources/VPlayerApp/Settings/PlaybackSettingsView.swift
      - path: Sources/VPlayerApp/Views/ChannelEPGMappingView.swift
      - path: Sources/VPlayerApp/Views/ChannelLogoView.swift
      - path: Sources/VPlayerApp/Views/ChannelProgrammePresentation.swift
      - path: Sources/VPlayerApp/Views/ChannelSections.swift
      - path: Sources/VPlayerApp/Views/EPGCoverageNotice.swift
      - path: Sources/VPlayerApp/Views/SourceProfilePresentation.swift
      - path: Sources/VPlayerApp/Views/SourceProfileValidationMessage.swift
      - path: Sources/VPlayerApp/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: VPlayerCoreiOS
      - target: VPlayerPlaybackiOS
      - sdk: CryptoKit.framework
      - sdk: NowPlaying.framework
    settings:
      base:
        PRODUCT_NAME: VPlayer
        PRODUCT_MODULE_NAME: VPlayer
        PRODUCT_BUNDLE_IDENTIFIER: com.vforce.vplayer.ios
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        INFOPLIST_FILE: Sources/VPlayeriOSApp/Resources/Info.plist
        CODE_SIGN_STYLE: Automatic
  VPlayeriOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: Tests/VPlayeriOSTests
      - path: Tests/VPlayerTests
        excludes:
          - ProjectConfigurationTests.swift
          - VPlayerAppStartupTests.swift
          - ReducedResourceUsageTests.swift
          - AppModelTests.swift
          - RefreshLifecycleTests.swift
          - SourceProfileURLPresentationTests.swift
          - Playback/DisplayCriteriaControllerTests.swift
          - Playback/PlaybackPresentationContextTests.swift
      - path: Tests/Fixtures/Video
        type: folder
        buildPhase: resources
      - path: Tests/Fixtures/playlists
        type: folder
        buildPhase: resources
      - path: Tests/Fixtures/epg
        type: folder
        buildPhase: resources
      - path: Tests/Fixtures/SourcePlanning
        type: folder
        buildPhase: resources
      - path: Tests/Fixtures/Images
        type: folder
        buildPhase: resources
      - path: Tests/VPlayerTests/Fixtures/Media/eac3-main-6x1block-5.1.eac3
        buildPhase: resources
      - path: Tests/VPlayerTests/Fixtures/Media/supported-audio-coverage.json
        buildPhase: resources
    dependencies:
      - target: VPlayerCoreiOS
      - target: VPlayerPlaybackiOS
      - target: VPlayeriOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vplayer.tests.ios
        GENERATE_INFOPLIST_FILE: true
  VPlayeriOSUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: Tests/VPlayeriOSUITests
    dependencies:
      - target: VPlayeriOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vplayer.uitests.ios
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: VPlayeriOS
schemes:
  VPlayer:
    build:
      targets:
        VPlayerCore: all
        VPlayerPlayback: all
        VPlayer: all
        VPlayerTests: [test]
        VPlayerUITests: [test]
    test:
      gatherCoverageData: true
      targets:
        - name: VPlayerTests
          parallelizable: true
        - name: VPlayerUITests
          parallelizable: false
    run:
      config: Debug
    archive:
      config: Release
  VPlayerReleaseBoundaryTests:
    build:
      targets:
        VPlayerCore: all
        VPlayerPlayback: all
        VPlayerReleaseBoundaryTests: [test]
    test:
      config: Release
      gatherCoverageData: false
      targets:
        - name: VPlayerReleaseBoundaryTests
          parallelizable: false
  VPlayerReleaseStartupTests:
    build:
      targets:
        VPlayerCore: all
        VPlayerPlayback: all
        VPlayer: all
        VPlayerUITests: [test]
    test:
      config: Release
      gatherCoverageData: false
      targets:
        - name: VPlayerUITests
          parallelizable: false
          selectedTests:
            - LiveStartupUITests
    run:
      config: Release
    profile:
      config: Release
    analyze:
      config: Release
    archive:
      config: Release
  VPlayerHLSAcceptance:
    build:
      targets:
        VPlayerCore: all
        VPlayerPlayback: all
        VPlayerHLSAcceptanceTests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      testPlans:
        - path: VPlayerHLSAcceptance.xctestplan
          defaultPlan: true
      targets:
        - name: VPlayerHLSAcceptanceTests
          parallelizable: false
  VPlayeriOS:
    build:
      targets:
        VPlayerCoreiOS: all
        VPlayerPlaybackiOS: all
        VPlayeriOS: all
        VPlayeriOSTests: [test]
        VPlayeriOSUITests: [test]
    test:
      gatherCoverageData: true
      targets:
        - name: VPlayeriOSTests
          parallelizable: false
        - name: VPlayeriOSUITests
          parallelizable: false
          skippedTests:
            - IOSReleaseStartupTests
    run:
      config: Debug
      executable: VPlayeriOS
    archive:
      config: Release
  VPlayeriOSReleaseStartup:
    build:
      targets:
        VPlayerCoreiOS: all
        VPlayerPlaybackiOS: all
        VPlayeriOS: all
        VPlayeriOSUITests: [test]
    test:
      config: Release
      gatherCoverageData: false
      targets:
        - name: VPlayeriOSUITests
          parallelizable: false
          selectedTests:
            - IOSReleaseStartupTests
